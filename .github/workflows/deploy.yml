name: 🚀 Deploy Website to cPanel

on:
  push:
    branches:
      - main
    # On n'active le déploiement que si les fichiers HTML/CSS/JS sont modifiés
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - '*.php'
      - '.htaccess'
      - 'api/**'
      - 'assets/**'

jobs:
  FTP-Deploy-Action:
    name: 🚚 Sync Files to Server
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: 📂 Sync files to cPanel
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # Port standard FTP ou 21
        port: 21
        # Dossier de destination sur votre cPanel (modifiez si besoin)
        server-dir: public_html/
        # On ne veut pas supprimer les fichiers existants non suivis par git (.htaccess, etc)
        delete-policy: false

# ==============================================================================
# SECTION 8 : CONTEXTE PÉDAGOGIQUE
# Informations qualitatives sur les pratiques d'enseignement en Algérie.
# Ces données informent le moteur IA de FreeGeny pour adapter le ton,
# la difficulté et la fréquence des exercices proposés.
# ==============================================================================

contexte_pedagogique:

  approche_generale: >
    L'enseignement primaire algérien repose sur la méthode "Génération 2"
    (الجيل الثاني), une réforme pédagogique centrée sur l'approche par
    compétences (APC). L'accent est mis sur la mémorisation structurée,
    la répétition guidée et la progression par séquences (مقاطع).

  points_cles:
    - "Approche par compétences (APC) – chaque unité vise une compétence précise"
    - "Fort accent sur la mémorisation (sourates, poèmes, règles de grammaire)"
    - "Répétition et consolidation avant d'avancer"
    - "Évaluations fréquentes : interrogations écrites, devoirs maison, contrôles"
    - "Manuel officiel ONPS comme référence unique – pas de manuels alternatifs"
    - "Discipline et respect de l'autorité comme valeurs transversales"
    - "Intégration des valeurs islamiques et civiques dans toutes les matières"

  profil_apprenant_typique:
    age_moyen: "6-7 ans (1AP)"
    langue_maison: "Dialecte algérien (darija) – différent de l'arabe scolaire"
    acces_technologie: "Variable – certaines familles ont smartphones/tablettes"
    soutien_familial: "Très important culturellement – les parents suivent activement"
    difficultes_frecquentes:
      - "Écart entre l'arabe dialectal parlé à la maison et l'arabe classique enseigné"
      - "Confusion entre lettres similaires (ب/ت/ث, ح/ج/خ, etc.)"
      - "Maîtrise des voyelles courtes (harakat) et de la lecture vocalisée"
      - "Mémorisation de sourates dans une langue non parlée quotidiennement"

  role_parent:
    implication: "Très forte – accompagnement quotidien attendu"
    attentes_freegeny:
      - "Tableau de bord parent pour suivre la progression"
      - "Notifications de devoirs et évaluations à venir"
      - "Ressources pour accompagner l'enfant à la maison"
      - "Rapports hebdomadaires de progression"

  role_enseignant:
    profil: "Enseignant généraliste – enseigne toutes les matières"
    formation: "École Normale Supérieure (ENS) ou Institut de Technologie de l'Éducation (ITE)"
    attentes_freegeny:
      - "Accès aux fiches de cours alignées sur le programme officiel"
      - "Génération automatique d'exercices et d'évaluations"
      - "Suivi de classe en temps réel"
      - "Export des bulletins et rapports"


# ==============================================================================
# SECTION 9 : SYSTÈME D'ÉVALUATION
# Structure officielle des évaluations dans le primaire algérien.
# Utilisée par FreeGeny pour calibrer les tests, calculer les moyennes
# et générer des bulletins conformes au système national.
# ==============================================================================

systeme_evaluation:

  echelle_notes:
    minimum: 0
    maximum: 20                # Sur 20, système français hérité
    passage: 10                # Note minimale de passage
    mention_passable: 10
    mention_assez_bien: 12
    mention_bien: 14
    mention_tres_bien: 16
    mention_excellent: 18

  frequence_evaluations:
    type_continu: "Évaluations formatives après chaque مقطع (séquence)"
    type_trimestriel: "Composition trimestrielle (examen de fin de trimestre)"
    type_annuel: "Bilan annuel – passage en classe supérieure"

  types_exercices_officiels:
    - "Lecture à voix haute (évaluation orale)"
    - "Dictée de mots et de phrases"
    - "Exercices de complétion (lacunes)"
    - "Questions de compréhension sur texte"
    - "Copie et calligraphie"
    - "Récitation de poèmes et sourates"
    - "Exercices d'association (image-mot)"
    - "Vrai/Faux"
    - "Coloriages guidés (lettres, drapeaux)"
    - "Production écrite courte (1-3 phrases)"

  coefficients_matieres_1ap:
    # Coefficients utilisés pour le calcul de la moyenne générale
    arabe: 5
    mathematiques: 5
    education_islamique: 2     # Intégrée au module arabe en 1AP
    education_civique: 1       # Intégrée au module arabe en 1AP
    education_scientifique: 2


# ==============================================================================
# SECTION 10 : CONFIGURATION FREEGENY
# Paramètres spécifiques à l'intégration de l'Algérie dans la plateforme
# FreeGeny. Ces données sont consommées directement par les microservices
# de configuration (CountryConfigService, CurriculumService, UIService).
# ==============================================================================

freegeny_config:

  # Identifiant unique du pays dans la base de données FreeGeny
  country_id: "DZ"
  schema_version: "3.1"
  last_updated: "2026-02-28"
  updated_by: "FreeGeny Pédagogic Team"
  statut: "production"         # Valeurs possibles : draft | review | production

  # Niveaux actuellement disponibles sur FreeGeny pour ce pays
  niveaux_disponibles: ["1ap"]
  niveaux_en_developpement: ["2ap", "3ap"]
  niveaux_planifies: ["4ap", "5ap"]

  # Langues de l'interface utilisateur disponibles pour ce pays
  langues_interface:
    - code: ar
      libelle: "العربية"
      defaut: true
    - code: fr
      libelle: "Français"
      defaut: false

  # Fonctionnalités activées pour ce pays
  fonctionnalites:
    progression_adaptative: true
    tts_audio: true            # Text-to-Speech – voix arabe fusha requise
    mode_hors_ligne: true      # Essentiel – connectivité internet variable en Algérie
    gamification: true
    suivi_parent: true
    tableau_de_bord_enseignant: true
    generation_exercices_ia: true
    reconnaissance_vocale: false  # Désactivé – complexité technique écriture arabe
    video_cours: false         # Désactivé – contrainte de bande passante
    mode_nuit: true

  # Paramètres de gamification
  gamification:
    systeme_badges: true
    badges_disponibles:
      - id: "lecteur_debutant"
        nom_fr: "Lecteur débutant"
        nom_ar: "قارئ مبتدئ"
        condition: "Lire 10 mots correctement"
      - id: "lecteur_courant"
        nom_fr: "Lecteur courant"
        nom_ar: "قارئ صغير"
        condition: "Lire 50 mots correctement"
      - id: "hafiz_jr"
        nom_fr: "Mémorisateur"
        nom_ar: "حافظ السور"
        condition: "Mémoriser 3 sourates"
      - id: "bon_eleve"
        nom_fr: "Bon élève"
        nom_ar: "تلميذ مهذب"
        condition: "Compléter 5 exercices sans erreur"
      - id: "champion_lettres"
        nom_fr: "Champion des lettres"
        nom_ar: "بطل الحروف"
        condition: "Reconnaître les 28 lettres de l'alphabet"
    systeme_points: true
    classement: false          # Désactivé – risque de pression négative pour les jeunes enfants
    recompenses_visuelles: true

  # Paramètres TTS (Text-to-Speech)
  tts_config:
    langue: "ar-DZ"            # Locale arabe algérienne
    variante_preferee: "ar-MSA" # Modern Standard Arabic – plus adapté au scolaire
    vitesse_defaut: 0.85       # Légèrement ralenti pour les enfants (1.0 = normal)
    vitesse_apprentissage: 0.65 # Mode "apprentissage lent"
    fournisseur_prefere: "Google TTS"  # Fallback : Amazon Polly (Zeina)
    voix_preferee_feminine: true  # Voix féminine préférée pour 1AP (plus douce)

  # Accessibilité
  accessibilite:
    taille_police_min: 18     # Grande taille pour les jeunes enfants
    images_colorees: true
    mode_contraste_eleve: false
    support_dyslexie: false   # Non implémenté pour l'arabe (à roadmap)
    navigation_simple: true   # Interface simplifiée pour 6-7 ans

  # Analytique et données
  analytique:
    tracking_active: true
    anonymisation_mineurs: true  # RGPD + protection des mineurs
    retention_donnees_jours: 365
    export_csv: true
    dashboard_enseignant: true
    rapports_automatiques: "hebdomadaire"

  # URLs et ressources
  ressources_externes:
    site_ministere: "https://www.education.gov.dz"
    programmes_officiels: "https://www.education.gov.dz/programmes-primaire"
    onps: "https://www.onps.dz"   # Office National des Publications Scolaires


# ==============================================================================
# SECTION 11 : OBJECTIFS GÉNÉRAUX DU SYSTÈME ÉDUCATIF ALGÉRIEN
# Vision macro du système éducatif, utile pour aligner FreeGeny sur les
# finalités pédagogiques nationales et les présenter aux partenaires.
# ==============================================================================

objectifs_generaux_systeme:

  objectifs_nationaux:
    - "Maîtrise de la langue arabe classique à l'écrit et à l'oral"

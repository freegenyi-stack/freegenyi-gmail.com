    - "Formation du citoyen algérien : valeurs islamiques, civiques et patriotiques"
    - "Ouverture progressive sur les langues étrangères (français, anglais)"
    - "Développement de l'esprit critique et de l'autonomie de l'élève"
    - "Égalité d'accès à l'éducation sur tout le territoire national"

  objectifs_freegeny_alignes:
    - "Renforcer les acquis scolaires par la pratique numérique guidée"
    - "Individualiser l'apprentissage dans le respect du programme officiel"
    - "Impliquer les parents dans le suivi scolaire"
    - "Réduire l'écart entre élèves ruraux et urbains grâce au numérique"
    - "Préparer l'élève aux évaluations officielles"

  specificites_culturelles:
    - "L'éducation islamique est transversale à toutes les matières"
    - "Le respect de la hiérarchie (parents, enseignants, aînés) est une valeur centrale"
    - "La langue arabe est vecteur d'identité nationale et de cohésion sociale"
    - "Les fêtes nationales (5 juillet, 1er novembre) sont enseignées avec fierté patriotique"
    - "La solidarité familiale et communautaire est fortement valorisée"



# ==============================================================================
# FICHIER : 1_signaletique.yaml
# PROJET  : FreeGeny – Plateforme EdTech internationale
# MODULE  : Référentiel pays / Country Reference Sheet
# VERSION : 2.0.0
# AUTEUR  : Équipe pédagogique & technique FreeGeny
# DATE    : 2026-02-28
# LICENCE : Propriétaire – Usage interne FreeGeny uniquement
# ------------------------------------------------------------------------------
# DESCRIPTION :
#   Ce fichier constitue la fiche signalétique officielle et exhaustive du
#   système éducatif algérien, à destination du moteur de personalisation
#   pédagogique de FreeGeny. Il sert de référence canonique pour :
#     - l'adaptation du contenu par niveau, langue et cycle
#     - la configuration des parcours d'apprentissage adaptatifs
#     - la conformité avec les programmes officiels algériens (Génération 2)
#     - l'intégration des manuels, évaluations et ressources pédagogiques
#
# UTILISATION TECHNIQUE :
#   - Chargé au démarrage de l'application via le service CountryConfigService
#   - Clé de routage principale : `code_iso` (valeur : "dz")
#   - Référencé par les modules : curriculum, evaluation, user_profile, analytics
#   - Compatible avec le standard FreeGeny Country Schema v3.1
#
# CONVENTIONS DE NOMMAGE :
#   - Clés en snake_case (ex: code_iso, langues_enseignees)
#   - Valeurs textuelles en français (interface) + arabe (contenu pédagogique)
#   - Identifiants de niveau en minuscules avec suffixe "ap" (ex: 1ap, 2ap)
#   - Booléens en minuscules : true / false
#
# DÉPENDANCES :
#   - programme_matiere_1ap_ar.yaml   → programme arabe 1AP
#   - semestre1.md, semestre2.md, semestre3.md → découpages trimestriels
#   - algerie_1ap_arabe_curriculum.json → données JSON du curriculum
#   - algerie_1ap_arabe_competences.json → référentiel de compétences
#
# HISTORIQUE DES VERSIONS :
#   v1.0.0 (2026-02-16) – Création initiale
#   v2.0.0 (2026-02-28) – Refonte complète : annotations expertes, ajouts
#                          exhaustifs, conformité FreeGeny Schema v3.1
# ==============================================================================


# ==============================================================================
# SECTION 1 : IDENTITÉ DU PAYS
# Données géopolitiques et linguistiques de base utilisées pour le routing
# de contenu et la configuration régionale de l'application.
# ==============================================================================

pays: Algérie                  # Nom officiel du pays (affichage UI)
nom_local: الجمهورية الجزائرية الديمقراطية الشعبية  # Nom officiel en arabe (pour les documents officiels)
code_iso: dz                   # ISO 3166-1 alpha-2 – clé primaire du pays dans FreeGeny
code_iso3: DZA                 # ISO 3166-1 alpha-3 – utilisé pour les intégrations API tierces
region: Afrique du Nord        # Région géographique (pour clustering analytique)
sous_region: Maghreb           # Sous-région (pour groupement pédagogique régional)
fuseau_horaire: Africa/Algiers # Timezone IANA – utilisé pour la planification des sessions
format_date: DD/MM/YYYY        # Format de date affiché dans l'UI
devise: DZD                    # Dinar Algérien – pour les modules e-commerce/abonnement
population_scolaire_estimee: 9000000  # Nombre d'élèves primaire (estimation 2025, source UNESCO)


# ==============================================================================
# SECTION 2 : LANGUES
# Configuration linguistique complète, essentielle pour le moteur de
# rendu multilingue de FreeGeny et la gestion de l'écriture RTL/LTR.
# ==============================================================================

langue_officielle: arabe       # Langue principale d'enseignement et de l'État
direction_ecriture: RTL        # Right-To-Left – impact direct sur le rendu CSS/React Native

langues_enseignees:
  # ----------------------------------------------------------------------------
  # Chaque entrée représente une langue enseignée dans le système scolaire.
  # Le champ `debut` indique le niveau d'introduction dans le parcours.
  # Le champ `statut` conditionne la priorité d'affichage dans FreeGeny.
  # ----------------------------------------------------------------------------

  - langue: arabe
    code_langue: ar             # Code ISO 639-1
    debut: 1ap                  # Introduit dès la 1ère année primaire
    fin: 5ap                    # Présente sur tout le cycle primaire
    statut: officielle          # Langue principale – affichée en priorité
    type: langue_maternelle_scolaire
    ecriture: arabe             # Alphabet arabe (28 lettres + signes diacritiques)
    direction: RTL
    variante: "arabe_classique" # Arabe fusha (فصحى), pas le dialecte darija
    note: >
      L'arabe enseigné est l'arabe classique/littéraire (اللغة العربية الفصحى).
      Le dialecte algérien (الدارجة) n'est pas utilisé dans les manuels officiels.
      Important pour FreeGeny : les exercices de prononciation doivent utiliser
      une voix TTS conforme à l'arabe standard moderne (MSA).
    obligatoire: true
    evalue: true
    coefficient_bilan: 5        # Coefficient pour le calcul de la moyenne (système algérien)

  - langue: francais
    code_langue: fr
    debut: 3ap                  # Introduit en 3ème année primaire (≈ 8-9 ans)
    fin: 5ap
    statut: premiere_langue_etrangere
    type: langue_etrangere_1
    ecriture: latin
    direction: LTR
    note: >
      Le français est la première langue étrangère introduite au primaire.
      FreeGeny doit activer le module "Français LV1" à partir du niveau 3ap
      uniquement. Les élèves de 1ap et 2ap ne voient pas ce module.
    obligatoire: true           # Obligatoire à partir de 3AP
    evalue: true
    coefficient_bilan: 3

  - langue: anglais
    code_langue: en
    debut: 3ap                  # Introduit en 3ème année, mais souvent optionnel en pratique
    fin: 5ap
    statut: deuxieme_langue_etrangere_optionnelle
    type: langue_etrangere_2
    ecriture: latin
    direction: LTR
    note: >
      L'anglais est officiellement introduit à partir de 3AP mais reste
      secondaire. Son enseignement peut varier selon les établissements.
      FreeGeny le propose en module optionnel activable par l'enseignant.
    obligatoire: false
    evalue: false               # Non évalué au bilan dans la majorité des cas
    coefficient_bilan: null

  - langue: tamazight
    code_langue: ber            # Code générique berbère (tzm pour tamazight central)
    debut: variable             # Varie selon la wilaya et l'établissement
    fin: variable
    statut: optionnelle
    type: langue_nationale_optionnelle
    ecriture: tifinagh          # Écriture officielle tifinagh + transcription latine possible
    direction: LTR
    note: >
      Le tamazight (berbère) est langue nationale et constitutionnelle depuis 2016.
      Son enseignement au primaire est variable selon les régions (Kabylie, Aurès,
      Mzab...). FreeGeny doit le proposer comme module activable régionalement,
      conditionné par la wilaya de l'établissement.
    obligatoire: false
    evalue: false
    coefficient_bilan: null
    regions_concernees:
      - Tizi Ouzou
      - Béjaïa
      - Bouira
      - Batna
      - Khenchela
      - Ghardaïa


# ==============================================================================
# SECTION 3 : STRUCTURE DU SYSTÈME SCOLAIRE
# Architecture complète du cycle primaire algérien.
# Utilisée par FreeGeny pour le routing des niveaux, la progression des
# élèves et la cohérence des parcours d'apprentissage.
# ==============================================================================

systeme:
  appellation: "Enseignement Primaire Algérien"
  code_systeme: "DZ-PRIMARY"   # Identifiant interne FreeGeny
  niveaux_couverts: "1AP à 5AP"
  duree_totale_annees: 5
  age_entree: 6                # Âge légal d'entrée en 1AP
  age_sortie: 11               # Âge théorique de fin de 5AP
  source_officielle: "Ministère de l'Éducation nationale – Programme 2015 (révisé 2020)"
  lien_officiel: "https://www.education.gov.dz/programmes-primaire"
  generation_programme: "Génération 2 / الجيل الثاني"
  annee_reforme: 2015
  annee_revision: 2020
  annee_scolaire_reference: "2025-2026"

niveaux:
  # ----------------------------------------------------------------------------
  # Chaque niveau correspond à une année scolaire du primaire algérien.
  # Ces entrées alimentent le sélecteur de niveau de l'UI FreeGeny et
  # conditionnent le chargement des curricula, exercices et évaluations.
  # ----------------------------------------------------------------------------

  - code: 1ap
    nom_fr: "Première année primaire"
    nom_ar: "السنة الأولى ابتدائي"
    age_min: 6
    age_max: 7
    cycle: cycle1
    ordre: 1                   # Position dans le cycle pour la progression linéaire
    actif_freegeny: true       # Ce niveau est disponible sur la plateforme
    couleur_ui: "#4CAF50"      # Vert – couleur associée à ce niveau dans l'UI FreeGeny
    icone: "star_1"            # Identifiant d'icône dans le design system FreeGeny

  - code: 2ap
    nom_fr: "Deuxième année primaire"
    nom_ar: "السنة الثانية ابتدائي"
    age_min: 7
    age_max: 8
    cycle: cycle1
    ordre: 2
    actif_freegeny: true
    couleur_ui: "#2196F3"
    icone: "star_2"

  - code: 3ap
    nom_fr: "Troisième année primaire"
    nom_ar: "السنة الثالثة ابتدائي"
    age_min: 8
    age_max: 9
    cycle: cycle1
    ordre: 3
    actif_freegeny: true
    couleur_ui: "#FF9800"
    icone: "star_3"

  - code: 4ap
    nom_fr: "Quatrième année primaire"
    nom_ar: "السنة الرابعة ابتدائي"
    age_min: 9
    age_max: 10
    cycle: cycle2
    ordre: 4
    actif_freegeny: true
    couleur_ui: "#9C27B0"
    icone: "star_4"

  - code: 5ap
    nom_fr: "Cinquième année primaire"
    nom_ar: "السنة الخامسة ابتدائي"
    age_min: 10
    age_max: 11
    cycle: cycle2
    ordre: 5
    actif_freegeny: true
    couleur_ui: "#F44336"
    icone: "star_5"
    note: >
      La 5AP est l'année de fin de cycle primaire. Elle se conclut par
      l'Examen de Fin de Cycle Primaire (شهادة التعليم الابتدائي).
      FreeGeny doit activer un mode "préparation examen" spécifique à ce niveau.
    examen_fin_cycle: true
    nom_examen: "شهادة التعليم الابتدائي"
    nom_examen_fr: "Brevet de l'Enseignement Primaire (BEP)"


# ==============================================================================
# SECTION 4 : CYCLES PÉDAGOGIQUES
# Les cycles structurent la progression des apprentissages sur 5 ans.
# FreeGeny utilise cette structure pour adapter les objectifs et les
# modalités d'évaluation selon la maturité cognitive de l'élève.
# ==============================================================================

cycles:
  cycle1:
    code: cycle1
    nom: "Cycle des apprentissages fondamentaux"
    nom_ar: "دورة التعلمات الأساسية"
    niveaux: ["1ap", "2ap", "3ap"]
    objectif_pedagogique: >
      Acquisition des fondamentaux : lecture, écriture, calcul, socialisation.
      L'élève passe de l'analphabétisme à la lecture courante et à l'écriture
      de phrases simples. Éveil scientifique et civique de base.
    approche_didactique: "Découverte progressive, mémorisation, répétition guidée"
    modalite_evaluation: "Évaluations formatives fréquentes, pas de redoublement automatique"

  cycle2:
    code: cycle2
    nom: "Cycle de consolidation et d'approfondissement"
    nom_ar: "دورة التعمق والتوسع"
    niveaux: ["4ap", "5ap"]
    objectif_pedagogique: >
      Consolidation et approfondissement de tous les acquis du cycle 1.
      Introduction à des concepts plus abstraits (raisonnement, argumentation,
      compréhension de textes complexes). Préparation à l'examen de fin de cycle.
    approche_didactique: "Résolution de problèmes, production écrite autonome, interdisciplinarité"
    modalite_evaluation: "Évaluations sommatives + préparation à l'examen national"


# ==============================================================================
# SECTION 5 : MATIÈRES PAR NIVEAU ET PAR CYCLE
# Référentiel complet des matières enseignées.
# Utilisé par FreeGeny pour construire le tableau de bord de l'élève
# et activer/désactiver les modules selon le niveau.
# ==============================================================================

matieres:

  # Matières communes à tous les niveaux du primaire
  communes_tous_niveaux:
    - code: arabe
      nom_fr: "Langue arabe"
      nom_ar: "اللغة العربية"
      inclus_dans_freegeny: true
      modules_freegeny: ["lecture", "ecriture", "grammaire", "conjugaison", "dictee", "poesie"]

    - code: mathematiques
      nom_fr: "Mathématiques"
      nom_ar: "الرياضيات"
      inclus_dans_freegeny: true
      modules_freegeny: ["calcul", "geometrie", "problemes", "mesures"]

    - code: education_islamique
      nom_fr: "Éducation islamique"
      nom_ar: "التربية الإسلامية"
      inclus_dans_freegeny: true
      modules_freegeny: ["sourates", "valeurs", "invocations", "comportements"]
      note: "Intégrée au module arabe en 1AP et 2AP (même manuel)"

    - code: education_civique
      nom_fr: "Éducation civique"
      nom_ar: "التربية المدنية"
      inclus_dans_freegeny: true
      modules_freegeny: ["citoyennete", "symboles_nationaux", "comportements_sociaux"]
      note: "Intégrée au module arabe en 1AP et 2AP (même manuel)"

    - code: education_scientifique
      nom_fr: "Éducation scientifique et technologique"
      nom_ar: "التربية العلمية والتكنولوجية"
      inclus_dans_freegeny: true
      modules_freegeny: ["sciences_naturelles", "technologie", "experimentation"]

  # Matières spécifiques au cycle 1 (1AP–3AP)
  cycle1_specifiques:
    note: >
      En cycle 1, les mathématiques et l'éducation scientifique sont regroupées
      dans un seul manuel en 1AP et 2AP. À partir de 3AP, les disciplines
      se séparent progressivement.

  # Matières spécifiques au cycle 2 (4AP–5AP)
  cycle2_specifiques:
    - code: francais
      nom_fr: "Langue française"
      nom_ar: "اللغة الفرنسية"
      niveaux_actifs: ["3ap", "4ap", "5ap"]
      inclus_dans_freegeny: true
      modules_freegeny: ["lecture_fr", "ecriture_fr", "grammaire_fr", "vocabulaire_fr"]

    - code: histoire_geographie
      nom_fr: "Histoire et Géographie"
      nom_ar: "التاريخ والجغرافيا"
      niveaux_actifs: ["3ap", "4ap", "5ap"]
      inclus_dans_freegeny: true
      modules_freegeny: ["histoire_algerie", "geographie", "cartes"]

    - code: anglais
      nom_fr: "Langue anglaise"
      nom_ar: "اللغة الإنجليزية"
      niveaux_actifs: ["3ap", "4ap", "5ap"]
      inclus_dans_freegeny: true
      optionnel: true
      modules_freegeny: ["anglais_debutant"]



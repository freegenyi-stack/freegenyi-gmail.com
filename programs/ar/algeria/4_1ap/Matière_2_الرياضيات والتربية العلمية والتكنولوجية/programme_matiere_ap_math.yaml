matiere: mathematiques_et_education_scientifique
niveau: 1ap
programme: "Algérie - Génération 2"
description: "Programme officiel de Mathématiques et Éducation Scientifique et Technologique pour la 1ère année primaire - Système éducatif algérien - الجيل الثاني"
langue_enseignement: "arabe"
age_cible: "6-7 ans"
annee_scolaire: "2025-2026"
manuel: "كتابي في الرياضيات والتربية العلمية والتكنولوجية للسنة الأولى ابتدائي الجيل الثاني"
cahier: "دفتر الأنشطة رياضيات و تربية علمية و تكنولوجية للسنة الأولى ابتدائي الجيل الثاني"

objectifs_generaux:
  - "تعلم العد والكتابة والمقارنة حتى 100"
  - "فهم المفاهيم الأساسية للجمع والطرح بدون احتفاظ"
  - "اكتشاف الأشكال الهندسية البسيطة والموقع في الفضاء"
  - "التعرف على الحواس والتنفس والقلب والتغذية والحركة"
  - "فهم أساسيات النظافة والمواد والتغذية المتوازنة"
  - "قراءة الجداول والساعة واستعمال الحاسبة بطريقة بسيطة"

competences_transversales:
  - "العد والمقارنة اليومية"
  - "الملاحظة والتجريب البسيط"
  - "وصف المواقع والأشكال"
  - "الالتزام بقواعد النظافة والصحة"
  - "حل وضعيات بسيطة من الحياة اليومية"

situations:
  - id: situation_01
    titre: "الوضعية الانطلاقية 1: في المدرسة"
    ordre: 1
    semestre: 1
    duree_estimee: "8-10 أسابيع"
    theme: "الدخول المدرسي + الأعداد حتى 10 + الحواس + الموقع في الفضاء + التغذية"
    lecons:
      - titre: "الأعداد من 1 إلى 5 (1)"
        objectifs: "عد كميات صغيرة متجانسة ومنظمة. قراءة الأعداد من 1 إلى 5."
      - titre: "تعيين موقع في الفضاء (1)"
        objectifs: "استعمال المصطلحات (أمام، وراء، بين، بجانب، مقابل) لوصف موقعه أو موقع شيء في الفضاء."
      - titre: "الحواس (1)"
        objectifs: "يتعرف على الحواس الخمس وعلى أهمية أعضاء الحس."
      - titre: "الأعداد من 1 إلى 5 (2)"
        objectifs: "مقارنة كميات واستعمال التعبير أكبر من، أقل من، بقدر."
      - titre: "الأعداد من 6 إلى 9 (1)"
        objectifs: "عد كميات صغيرة متجانسة ومنظمة. قراءة الأعداد من 6 إلى 9."
      - titre: "الأعداد من 6 إلى 9 (2)"
        objectifs: "عد كميات صغيرة واستعمال التعبير أقل من، أكبر من، بقدر."
      - titre: "الحواس (2)"
        objectifs: "يتعرف على بعض القواعد الصحية ويمارسها حفاظا على أعضاء الحس."
      - titre: "الأعداد من 1 إلى 9"
        objectifs: "مقارنة كميات واستعمال التعبير أكبر من، أقل من، بقدر."
      - titre: "تعيين موقع في الفضاء (2)"
        objectifs: "استعمال المصطلحات (فوق، تحت، على، أعلى، أسفل) لوصف موقعه أو موقع شيء في الفضاء."
      - titre: "تشكيل كميات"
        objectifs: "تشكيل مجموعة مثل كمية (عدد) أصغر من 10."
      - titre: "أنا أتحرك وأتنقل"
        objectifs: "يدرك أهمية الحركة والتنقل ويميز مختلف أنواع التنقل."
      - titre: "العدد 0"
        objectifs: "اكتشاف الصفر والكتابة بالأرقام للعددين 0 و 1."
      - titre: "عد كميات صغيرة"
        objectifs: "عد كميات صغيرة غير متجانسة وكتابة العددين 2 و3."
      - titre: "كيف أتحرك؟"
        objectifs: "يتعرف على مختلف أنماط التنقل والأعضاء المسؤولة عنه."
      - titre: "العدد 10"
        objectifs: "تكوين العشرة والبحث عما ينقص لإتمام كمية تتكون من 10 أشياء وكتابة العددين 4 و 5."
      - titre: "استعمال العدد لتذكر كمية"
        objectifs: "ممارسة وظيفة العدد للتعبير عن كمية في غيابها وكتابة العددين 6 و 7."
      - titre: "استعمال العدد لتعيين رتبة"
        objectifs: "ممارسة وظيفة العدد لتعيين موضع (أو رتبة) وكتابة الأعداد 8 و 9."
      - titre: "أتحرك وأحافظ على صحتي"
        objectifs: "يذكر بعض العادات الحسنة للحفاظ على سلامة أعضاء الحركة."
      - titre: "استخراج معلومات"
        objectifs: "استخراج معلومات من وثيقة أو جدول في وضعيات بسيطة."
      - titre: "تعيين موقع في الفضاء (3)"
        objectifs: "استعمال المصطلحات (يمين، يسار، عن يمين، عن يسار) لوصف موقعه أو موقع شيء في الفضاء."
      - titre: "أصنف أغذيتي"
        objectifs: "يصنف الأغذية حسب مصدرها ويتعرف على عادات غذائية صحية."
      - titre: "متتالية الأعداد إلى 10"
        objectifs: "مقارنة وترتيب وحصر أعداد واستعمال التعبير 'أكبر من'، 'أصغر من'، وكتابة العدد 10."
      - titre: "مقارنة أطوال (1)"
        objectifs: "مقارنة أشياء وترتيبها حسب الطول."
      - titre: "أغذيتي متنوعة"
        objectifs: "يتعرف على مفهوم التغذية المتوازنة ويلتزم ببعض قواعدها."
      - titre: "مقارنة أطوال (2)"
        objectifs: "مقارنة أطوال واستعمال التعبيرين 'أطول من' و 'أقصر من'."
      - titre: "المسالك (1)"
        objectifs: "اتباع مسلك."
      - titre: "وضعيات جمع أو طرح (1)"
        objectifs: "التعرف على وضعيات جمع و/أو طرح."
      - titre: "أغذيتي صحية"
        objectifs: "يتعرف على بعض العادات الغذائية الصحية ويلتزم بها."
      - titre: "الرمزان + و ="
        objectifs: "التعرف على الرمزين + و= واستعمالها."
      - titre: "الرمزان - و ="
        objectifs: "التعرف على الرمزين - و= واستعمالها."
      - titre: "الكتابات المختلفة لعدد"
        objectifs: "البحث عن مفكوك جمعي لعدد أصغر من أو يساوي 10."


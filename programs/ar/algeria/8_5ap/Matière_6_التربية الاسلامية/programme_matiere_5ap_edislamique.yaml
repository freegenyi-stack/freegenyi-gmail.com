      - "Respecter l'autorité légitime"
    
    contenu_apprentissage:
      obeissance_divine:
        definition: "Suivre les commandements d'Allah"
        importance: "Fondation de la vie religieuse"
        sources:
          - "Coran"
          - "Sunnah du Prophète"
          - "Ijma' (consensus)"
        
        types_obéissance:

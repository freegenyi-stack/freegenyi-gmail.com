  - id: module_s2_02
    titre_ar: "التحقق لا يأتي إلا بخير"
    titre_fr: "La foi et ses bonnes conséquences"
    ordre: 12
    semestre: 2
    duree_estimee: "2 semaines"
    theme_principal: "foi_consequences"
    numero_lecon: 12

          - "Obéissance à l'interdiction des péchés"
          - "Obéissance aux conseils (Mustahabbat)"
        
        récompenses:
          - "Entrée au Paradis"
          - "Victoire et succès"
          - "Paix et sérénité"
          - "Amour d'Allah"
      
      obeissance_aux_parents:
        commandement: "Honorer et obéir aux parents"
        limite: "Sauf dans le péché"

matiere: education_islamique
niveau: 5ap
programme: "Algérie - Génération 2"
description: "Programme officiel d'éducation islamique pour la 5ème année primaire (Système éducatif algérien)"
domaine_apprentissage: "Éducation religieuse et morale islamique"
age_cible: "10-11 ans"
annee_scolaire: "2024-2025"

# ============================================================
# MÉTADONNÉES PÉDAGOGIQUES GLOBALES
# ============================================================

objectifs_generaux:
  - "Renforcer la foi et l'attachement à l'Islam"
  - "Connaître les principes fondamentaux de l'Islam"
  - "Maîtriser les pratiques religieuses (Salat, Zakat, Jeûne, etc.)"
  - "Mémoriser et comprendre des sourates et hadiths du Coran"
  - "Développer le caractère moral islamique"
  - "Respecter les valeurs islamo-arabes"
  - "Connaître l'histoire des prophètes et sahaba (compagnons)"
  - "Cultiver la droiture et le bien-vivre ensemble"
  - "Développer la conscience morale basée sur l'Islam"

competences_transversales:
  - "Compréhension du Coran et Sunnah"
  - "Pratique des actes d'adoration"
  - "Mémorisation et récitation"
  - "Analyse des valeurs morales"
  - "Application pratique des enseignements"
  - "Respect de l'éthique islamique"
  - "Communication sur les sujets religieux"
  - "Comportement islamique conforme"
  - "Développement de la piété (Taqwa)"

# ============================================================
# STRUCTURE DU PROGRAMME PAR MODULES/THÈMES
# ============================================================

modules:

# ============================================================
# SECTION 1 (المقطع الأول) : ENSEIGNEMENTS CORANIQUES ET PRATIQUES
# ============================================================

  - id: module_01
    titre_ar: "سورة البلد"
    titre_fr: "Sourate Al-Balad (La ville)"
    ordre: 1
    semestre: 1
    duree_estimee: "2 semaines"
    theme_principal: "coran_sourates"
    numero_lecon: 1
    page_debut: 8
    type: "sourate"
    
    competences_principales:
      - "Mémoriser et réciter Al-Balad"
      - "Comprendre les thèmes de la sourate"
      - "Appliquer les leçons morales"
    
    contenu_apprentissage:
      sourate_info:
        numero: "Sourate 90"
        nombre_versets: "20 versets"
        periode_revelation: "Période mecquoise"
        themes_principaux:
          - "Serment par la ville (La Mecque)"
          - "Serment par le créateur et la créature"
          - "Responsabilité personnelle"
          - "Libre arbitre humain"
          - "Les deux chemins (bien et mal)"
          - "Droits des parents et pauvres"
        
        versets_importants:
          - verset: "1-2"
            thème: "Serment par la ville et ses habitants"
          
          - verset: "11-17"
            thème: "Les deux chemins : celui du bien et celui du mal"
            contenu: "Description du cheminement vers la vertu"
          
          - verset: "18-20"
            thème: "Droits du pauvre et de celui qui a besoin"
            contenu: "Importance du don et de l'aide aux nécessiteux"
      
      lecons_morales:
        - "Chaque âme est responsable de ses actes"
        - "Dieu a montré à l'homme les deux chemins"
        - "L'obligation de s'entraider et d'aider les pauvres"
        - "L'importance de la foi et de la droiture"
      
      pratique_memorisation:
        - "Lecture plusieurs fois"
        - "Écoute de la récitation"
        - "Mémorisation par versets"
        - "Récitation en groupe"

  - id: module_02
    titre_ar: "المسلم يحب الخير"
    titre_fr: "Le musulman aime le bien"
    ordre: 2
    semestre: 1
    duree_estimee: "2 semaines"
    theme_principal: "moralite_musulmane"
    numero_lecon: 2
    page_debut: 11
    
    competences_principales:
      - "Développer l'amour du bien"
      - "Comprendre les qualités positives"
      - "Pratiquer le bien dans la vie quotidienne"
    
    contenu_apprentissage:
      valeurs_islamiques:
        - nom: "La charité (Al-Sadaqah)"
          definition: "Donner aux nécessiteux par compassion"
          importance: "Grande récompense dans l'Islam"
          types:
            - "Charité obligatoire (Zakat)"
            - "Charité volontaire (Sadaqah)"
          pratique: "Donner à la famille, amis, pauvres"
        
        - nom: "L'honnêteté (Al-Sidq)"
          definition: "Dire la vérité dans paroles et actions"
          consequences: "Mène au Paradis"
          contraste: "Le mensonge mène en Enfer"
        
        - nom: "Le pardon (Al-Afwa)"
          definition: "Pardonner les offenses d'autrui"
          hadith: "Le Prophète recommande le pardon"
          benefices: "Paix intérieure et sociale"
        
        - nom: "La miséricorde (Al-Rahma)"
          definition: "Compassion envers tous"
          hadith: "Celui qui n'a pas de miséricorde n'aura pas de miséricorde"
          application: "Envers humains et animaux"
      
      comportements_positifs:
        - "Aider les parents et les proches"
        - "Respecter les droits d'autrui"
        - "Être juste dans les rapports"
        - "Honorer ses promesses"
        - "Être loyal et confiant"

  - id: module_03
    titre_ar: "تفريغ الركعات"
    titre_fr: "Les mouvements de la prière (Rakaat)"
    ordre: 3
    semestre: 1
    duree_estimee: "3 semaines"
    theme_principal: "pratique_salat"
    numero_lecon: 3
    page_debut: 13
    
    competences_principales:
      - "Maîtriser les mouvements de la prière"
      - "Comprendre le sens de chaque position"
      - "Pratiquer la prière correctement"
    
    contenu_apprentissage:
      positions_priere:
        - position: "Takbir al-Ihram"
          description: "Lever les mains et dire Allahu Akbar"
          sens: "Consécration à Dieu"
          condition: "Intention intérieure (Niyyah)"
        
        - position: "Qiyam"
          description: "Position debout"
          duree: "Récitation de la Fatiha et autres sourates"
          importance: "Humilité devant Dieu"
        
        - position: "Ruku"
          description: "Inclinaison depuis la taille"
          position_corps: "Dos horizontal, mains sur les genoux"
          dhikr: "Subhana rabbiya al-'azim (Gloire à mon Seigneur Suprême)"
          sens: "Respect et soumission"
        
        - position: "I'tidal"
          description: "Redressement après Ruku"
          dhikr: "Sami'allahu liman hamidah, rabbana wa laka al-hamd"
          sens: "Gratitude"
        
        - position: "Sujud"
          description: "Prosternation au sol"
          contact_sol: "Front, nez, paumes, genoux, orteils"
          dhikr: "Subhana rabbiya al-a'la (Gloire à mon Seigneur le Très-Haut)"
          importance: "Position d'humilité extrême"
          nombre: "Deux sajdahs par raka'ah"
        
        - position: "Julus"
          description: "Position assise entre deux sajdahs"
          dhikr: "Du'a et invocations"
        
        - position: "Tashahhud"
          description: "Position assise finale"
          recitation: "At-Tahiyyat et Salaat Ibrahim"
          importance: "Acceptation de la prière"
      
      structure_priere:
        priere_maghrib: "3 raka'ahs"
        priere_asr: "4 raka'ahs"
        priere_zuhr: "4 raka'ahs"
        priere_fajr: "2 raka'ahs"
        priere_isha: "4 raka'ahs"
      
      conditions_priere:
        - "Ablution (Wudu) complète"
        - "Direction vers La Mecque (Qibla)"
        - "Couverture convenable"
        - "Intention sincère"
        - "Temps approprié pour chaque prière"

  - id: module_04
    titre_ar: "الإيمان باليوم الآخر"
    titre_fr: "La foi au Jour du Jugement"
    ordre: 4
    semestre: 1
    duree_estimee: "2 semaines"
    theme_principal: "eschatologie_islamique"
    numero_lecon: 4
    page_debut: 15
    
    competences_principales:
      - "Comprendre les croyances au Jour du Jugement"
      - "Connaître les étapes de l'Au-delà"
      - "Développer la conscience de l'Accountability"
    
    contenu_apprentissage:
      piliers_foi_akhira:
        - pilier: "Résurrection"
          description: "Tous les morts seront ressuscités"
          coran: "Sourate Al-Hajj 7"
          sens: "Nouvelle vie après la mort"
        
        - pilier: "Jugement divin"
          description: "Dieu jugera tous selon leurs actes"
          coran: "Sourate An-Nahl 111"
          consequences: "Récompense ou châtiment"
        
        - pilier: "Paradis (Al-Jannah)"
          description: "Demeure éternelle des justes"
          caracteristiques: ["Joies éternelles", "Absence de souffrance", "Satisfaction complète"]
          residents: "Ceux qui ont cru et fait le bien"
        
        - pilier: "Enfer (An-Naar)"
          description: "Châtiment pour les incrédules et pécheurs"
          avertissement: "Lieu de tourment"
          but: "Incitation à faire le bien"
      
      signes_avant_jugement:
        signes_mineurs:
          - "Abaissement du savoir"
          - "Augmentation de l'ignorance"
          - "Fornication et alcool"
          - "Tremblement de terre fréquents"
          - "Immoralité accrue"
        
        signes_majeurs:
          - "Émergence du Dajjal (Anti-Christ)"
          - "Retour de Jésus"
          - "Gog et Magog (Yajuj wa Majuj)"
          - "Le Soleil se lève de l'Ouest"
          - "L'heure arrive soudainement"
      
      etapes_akhira:
        - etape: "Mort"
          description: "Séparation de l'âme du corps"
        
        - etape: "Barzakh"
          description: "Période entre mort et résurrection"
          duree: "Connue de Dieu seul"
        
        - etape: "Résurrection"
          description: "Retour du corps et de l'âme"
          universel: "Toute créature ressuscitée"
        
        - etape: "Rassemblement"
          description: "Tous réunis pour jugement"
          lieu: "Terrain du Jugement"
        
        - etape: "Jugement"
          description: "Interrogation et pesée des actes"
          balance: "Mizan (balance) de la justice divine"
        
        - etape: "Paradis ou Enfer"
          description: "Destination éternelle"
          permanence: "Éternelle et sans fin"

  - id: module_05
    titre_ar: "من صفات الله تعالى (العالم)"
    titre_fr: "Attributs d'Allah (Le Savant)"
    ordre: 5
    semestre: 1
    duree_estimee: "2 semaines"
    theme_principal: "attributs_divins"
    numero_lecon: 5
    page_debut: 18
    
    competences_principales:
      - "Connaître les attributs d'Allah"
      - "Développer l'amour envers Dieu"
      - "Comprendre la perfection divine"
    
    contenu_apprentissage:
      attributs_divins:
        - nom_arabe: "Al-'Alim"
          nom_francais: "Le Savant/Celui qui sait"
          definition: "Allah connaît tout : passé, présent, futur"
          caractéristiques:
            - "Connaissance absolue et parfaite"
            - "Science non limitée par le temps et l'espace"
            - "Connaissance des secrets et intentions"
          verset_coran: "C'est Lui qui sait ce qui est secret et ce qui est apparent" (Al-An'am 73)
          implication: "On ne peut rien cacher à Allah"
        
        - nom_arabe: "Al-Qadi"
          nom_francais: "Le Juge"
          definition: "Allah juge avec justice absolue"
        
        - nom_arabe: "Al-Adl"
          nom_francais: "Le Juste"
          definition: "Allah ne commet pas d'injustice"
        
        - nom_arabe: "Ar-Rahman"
          nom_francais: "Le Miséricordieux"
          definition: "Allah a une miséricorde infinie"
        
        - nom_arabe: "As-Samit"
          nom_francais: "Le Celui qui écoute tout"
          definition: "Allah entend toutes les invocations"
      
      consequences_spirituelles:
        - "Crainte et respect envers Dieu"
        - "Conscience que Dieu voit tout"
        - "Confiance en la justice divine"
        - "Amour envers la miséricorde divine"
        - "Effort pour plaire à Allah"

  - id: module_06
    titre_ar: "من مظاهر البر في المجادات: الضحايا"
    titre_fr: "Manifestations de la piété dans les actes : Le sacrifice"
    ordre: 6
    semestre: 1
    duree_estimee: "2 semaines"
    theme_principal: "adab_ibadah"
    numero_lecon: 6
    page_debut: 20
    
    competences_principales:
      - "Comprendre l'importance du sacrifice"
      - "Pratiquer l'esprit du sacrifice"
      - "Connaître les pratiques liées au Hajj"
    
    contenu_apprentissage:
      sacrifice_islamique:
        definition: "Offrande d'un animal pour satisfaire Allah"
        periode: "Journées du Hajj (Aïd Al-Adha)"
        animals_acceptes:
          - nom: "Bélier"
            age_minimum: "5 ans"
          - nom: "Chevre"
            age_minimum: "2 ans"
          - nom: "Vache"
            age_minimum: "2 ans"
          - nom: "Chameau"
            age_minimum: "5 ans"
        
        conditions:
          - "Animal sain et sans défaut"
          - "Intention sincère"
          - "Effort physique personnellement"
        
        distribution:
          - "Tiers pour soi"
          - "Tiers pour la famille"
          - "Tiers pour les pauvres"
        
        signification_spirituelle:
          - "Soumission à Allah"
          - "Suivi du Prophète Ibrahim"
          - "Générosité et partage"
          - "Oubli de ses désirs personnels"
      
      spirit_sacrifice:
        - "Véritable sacrifice n'est pas la viande"
        - "C'est l'intention du cœur qui compte"
        - "Piété envers Allah (Taqwa)"
        - "Charité envers les nécessiteux"

  - id: module_07
    titre_ar: "الحج (الأركان وفوائده)"
    titre_fr: "Le Hajj (piliers et bénéfices)"
    ordre: 7
    semestre: 1
    duree_estimee: "2 semaines"
    theme_principal: "hajj_pillerinage"
    numero_lecon: 7
    page_debut: 22
    
    competences_principales:
      - "Connaître les piliers du Hajj"
      - "Comprendre les bénéfices du pillerinage"
      - "Respecter la sainteté du Hajj"
    
    contenu_apprentissage:
      pilliers_hajj:
        - pilier: "Intention (Niyyah) et Ihram"
          description: "Entrer dans l'état sacré"
          conditions: ["État de pureté", "Vêtements spéciaux", "Intention sincère"]
        
        - pilier: "Circumambulation (Tawaf)"
          description: "Tourner autour de la Ka'aba 7 fois"
          sens: "Adoratioon et respect"
        
        - pilier: "Sa'y"
          description: "Marche entre Safa et Marwa"
          nombre_fois: "7 fois"
          commemoration: "Recherche de l'eau par Hagar"
        
        - pilier: "Wuquf à Arafat"
          description: "Se tenir à Arafat le 9e jour"
          importance: "Essence du Hajj"
          duree: "Depuis midday jusqu'au coucher"
        
        - pilier: "Tawaf Al-Ifada"
          description: "Circumambulation finale après Arafat"
        
        - pilier: "Sa'y Final"
          description: "Dernière marche entre Safa et Marwa"
      
      bénéfices_hajj:
        spirituels:
          - "Purification des péchés"
          - "Renforcement de la foi"
          - "Proximité avec Allah"
          - "Paix intérieure"
        
        sociaux:
          - "Unité des musulmans (3 millions+)"
          - "Égalité devant Dieu"
          - "Fraternité universelle"
          - "Échange de cultures"
        
        personnels:
          - "Discipline et persévérance"
          - "Patience et abnégation"
          - "Humilité"
          - "Renouveau personnel"
      
      restrictions_ihram:
        - "Interdiction de chasse"
        - "Interdiction de relations"
        - "Interdiction de parfum"
        - "Interdiction de couper les ongles"
        - "Interdiction de raser la barbe"
        - "Interdiction de disputer ou insulter"

  - id: module_08
    titre_ar: "الإيثار"
    titre_fr: "L'altruisme (Ithar)"
    ordre: 8
    semestre: 1
    duree_estimee: "2 semaines"
    theme_principal: "valeurs_morales"
    numero_lecon: 8
    page_debut: 25
    
    competences_principales:
      - "Développer l'altruisme"
      - "Préférer autrui à soi-même"
      - "Pratiquer la générosité inconditionnelle"
    
    contenu_apprentissage:
      concept_ithar:
        definition: "Préférer le bien d'autrui à son propre bien"
        origine: "Sourate Al-Hashr 59:9"
        vers_coran: "Ceux qui Lui ont préféré à eux-mêmes, même s'ils étaient dans le besoin"
        niveau_piété: "Manifestation de la plus haute piété"
      
      exemples_coran:
        - personnage: "Les Compagnons du Prophète"
          exemple: "Partage de leurs biens avec les migrants (Muhajiroun)"
          resultat: "Loué dans le Coran"
        
        - personnage: "Ayub (Job)"
          exemple: "Distribuer à des pauvres malgré sa propre pauvreté"
          leçon: "Confiance en Allah"
        
        - personnage: "Les gens de Madinah"
          exemple: "Accueil des migrants avec maisons et biens"
          titre: "Ansars (helpers)"
      
      pratique_ithar:
        - "Donner le meilleur à autrui"
        - "Partager la nourriture et biens"
        - "Aider sans espoir de retour"
        - "Oublier son propre besoin pour celui d'autrui"
        - "Joie sincère du bien d'autrui"
      
      obstacles_ithar:
        - "Égoïsme"
        - "Avarice"
        - "Amour des biens"
        - "Manque de conscience divine"
      
      résultats:
        - "Amour d'Allah et du Prophète"
        - "Paix intérieure"
        - "Communauté unie"
        - "Récompense éternelle"

  - id: module_09
    titre_ar: "من زعايا لغمان لإبنه"
    titre_fr: "Des conseils de Luqman à son fils"
    ordre: 9
    semestre: 1
    duree_estimee: "2 semaines"
    theme_principal: "sagesse_luqman"
    numero_lecon: 9
    page_debut: 27
    
    competences_principales:
      - "Apprendre de la sagesse de Luqman"
      - "Appliquer les conseils moraux"
      - "Comprendre l'éducation parentale"
    
    contenu_apprentissage:
      conseils_luqman:
        - conseil: "Ne pas associer d'autres à Allah"
          importance: "Cœur du monothéisme"
          explication: "L'associationnisme est le plus grand péché"
        
        - conseil: "Bienveillance envers les parents"
          versets: "Luqman 14-15"
          explication: "Respect et soin de la mère et père"
          age: "Même dans la vieillesse"
        
        - conseil: "Gratitude envers Allah"
          leçon: "Remercier pour chaque bienfait"
          contraste: "Ingratitude mène à la perte"
        
        - conseil: "Établissement de la prière"
          importance: "Fondation de la vie religieuse"
          commandement: "Ordonner le bien et interdire le mal"
        
        - conseil: "Patience dans l'adversité"
          caractère: "Marque de la noblesse"
          exemple: "Les prophètes étaient patients"
        
        - conseil: "Humilité et modestie"
          enseignement: "Ne pas marcher avec fierté"
          raison: "Allah n'aime pas les orgueilleux"
        
        - conseil: "Modération dans la voix"
          leçon: "La voix la plus douce est celle de l'âne"
          sens: "Élégance et dignité"
      
      sagesse_luqman:
        style: "Doux, aimant et persuasif"
        methode: "Éducation progressive et réfléchie"
        objectif: "Formation du caractère moral"
        resultat: "Enfant vertueux et respectueux"

  - id: module_10
    titre_ar: "الطاعة"
    titre_fr: "L'obéissance"
    ordre: 10
    semestre: 1
    duree_estimee: "2 semaines"
    theme_principal: "valeur_obeissance"
    numero_lecon: 10
    page_debut: 29
    
    competences_principales:

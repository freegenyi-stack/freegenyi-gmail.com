matiere: education_civique
niveau: 5ap
programme: "Algérie - Génération 2"
description: "Programme officiel d'éducation civique pour la 5ème année primaire (Système éducatif algérien)"
domaine_apprentissage: "Éducation civique et morale"
age_cible: "10-11 ans"
annee_scolaire: "2024-2025"

# ============================================================
# MÉTADONNÉES PÉDAGOGIQUES GLOBALES
# ============================================================

objectifs_generaux:
  - "Développer la conscience citoyenne et les valeurs démocratiques"
  - "Comprendre les droits et devoirs du citoyen"
  - "Connaître les institutions et structures de la société"
  - "Apprendre à vivre ensemble dans le respect d'autrui"
  - "Développer l'esprit de responsabilité individuelle et collective"
  - "Promouvoir la tolérance et le respect des différences"
  - "Comprendre les règles et lois qui régissent la vie en société"
  - "Cultiver le patriotisme et l'amour de la patrie"
  - "Développer les valeurs morales et éthiques"

competences_transversales:
  - "Respect des lois et des règles"
  - "Responsabilité personnelle et collective"
  - "Participation citoyenne"
  - "Respect des droits humains"
  - "Tolérance et dialogue"
  - "Solidarité et coopération"
  - "Sens du devoir"
  - "Pensée critique citoyenne"
  - "Conscience morale"
  - "Compétences de communication sociale"

# ============================================================
# STRUCTURE DU PROGRAMME PAR MODULES/THÈMES
# ============================================================

modules:

# ============================================================
# SECTION 1 : LA VIE COLLECTIVE (الحياة الجماعية)
# ============================================================

  - id: module_01
    titre_ar: "المؤسسات الجماهيرية والإدارة الإلكترونية"
    titre_fr: "Les institutions collectives et l'administration électronique"
    ordre: 1
    semestre: 1
    duree_estimee: "2-3 semaines"
    theme_principal: "institutions_collectives"
    numero_lecon: 1
    page_debut: 7
    description: "Comprendre les institutions collectives et l'administration moderne"
    
    competences_principales:
      - "Identifier les institutions publiques"
      - "Comprendre les rôles des administrations"
      - "Utiliser les services électroniques"
      - "Respecter les procédures administratives"
    
    contenu_apprentissage:
      concepts_cles:
        - titre_ar: "المؤسسات العمومية"
          titre_fr: "Les institutions publiques"
          definition: "Organisations au service de l'intérêt public"
          types:
            - nom: "Services administratifs"
              exemples: ["Mairie", "Préfecture", "Douanes"]
              role: "Gestion des affaires publiques"
            
            - nom: "Services sociaux"
              exemples: ["Hôpitaux", "Écoles", "Centres sociaux"]
              role: "Bien-être des citoyens"
            
            - nom: "Services de sécurité"
              exemples: ["Police", "Gendarmerie", "Pompiers"]
              role: "Protection et sécurité"
        
        - titre_ar: "الإدارة الإلكترونية"
          titre_fr: "L'administration électronique"
          definition: "Utilisation des technologies pour les services publics"
          avantages:
            - "Gain de temps"
            - "Facilité d'accès"
            - "Transparence accrue"
            - "Réduction des frais"
          services_electroniques:
            - "Demandes en ligne"
            - "Paiement électronique"
            - "Consultation de dossiers"
            - "Signatures numériques"
          precautions:
            - "Confidentialité des données"
            - "Sécurité des transactions"
            - "Vérification de l'authenticité"
    
    activites_apprentissage:
      - type: "visite_simulation"
        titre: "Visite d'une institution publique (réelle ou virtuelle)"
        objectif: "Découvrir le fonctionnement des institutions"
      
      - type: "pratique_digitale"
        titre: "Utiliser des services en ligne"
        objectif: "Apprendre à naviguer les portails numériques"
      
      - type: "discussion"
        titre: "Débat sur l'impact de la technologie"
        questions:
          - "Quels sont les avantages de l'administration électronique ?"
          - "Quels sont les risques ?"
          - "Comment protéger ses données ?"


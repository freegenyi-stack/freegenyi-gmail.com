# ============================================================
# MODULE 4 : TUZIPISST - GRAMMAIRE ET STRUCTURE
# ============================================================
  - id: module_04
    titre_tamazight: "Ad d-naskar tuzipisst - akân ad nsalfu imdanân"
    titre_francais: "Grammaire et structure (Applications grammaticales)"
    ordre: 4
    trimestre: 2
    duree_estimee: "5-6 semaines"
    theme_principal: "grammaire_syntaxe"
    couleur_code: "rose"
    
    description_pedagogique: |
      Ce module consolide l'apprentissage grammatical du tamazight à travers
      des applications pratiques et contextualisées. Il réunit les structures
      apprises dans les modules précédents et développe la maîtrise syntaxique.
    
    sequences:
      # SECTION 1: GRAMMAIRE AVEC CONTEXTE ANIMALIER
      - id: seq_04_01
        titre_tamazight: "Ad sakiγ iymiḥan n usimas n tunaḍt"
        titre_francais: "Grammaire avec contexte animalier (réutilisation Module 1)"
        page_reference: 82
        ordre: 1
        duree_estimee: "1.5 semaine"
        type: "application_grammaticale"
        
        objectifs_specifiques:
          - "Consolider les structures du Module 1"
          - "Appliquer la grammaire au vocabulaire animal"
          - "Produire des phrases complexes"
          - "Développer la maîtrise syntaxique"
        
        competences_visees:
          - "Formation de phrases sur les animaux"
          - "Utilisation correcte des accords"
          - "Application des temps verbaux"
          - "Construction d'énoncés cohérents"
        
        contenu_grammatical:
          structures_principales:
            - nom: "Nom + adjectif"
              contexte_animal: "Yabta-w amazuaru (chat noir)"
              accord: "L'adjectif s'accorde en genre et nombre"
            
            - nom: "Sujet + verbe + objet"
              exemple: "Yabtaw yekka izaṛ"
              construction: "SVO (Sujet-Verbe-Objet)"
            
            - nom: "Verbes avec compléments"
              exemple: "Aγil yimi adzimu (le chien boit du lait)"
              verbes: ["ekki (manger)", "imi (boire)", "feg (sauter)"]
        
        activites_proposees:
          - id: activite_4_1_1
            titre: "Former des phrases avec animaux"
            type: "exercice_syntaxique"
            elements: ["nom animal", "adjectif", "verbe", "complément"]
          
          - id: activite_4_1_2
            titre: "Analyser la structure de phrases"
            type: "analyse_grammaticale"
            competence: "Identification des composantes"
          
          - id: activite_4_1_3
            titre: "Production libre: description animal"
            type: "production_ecrite"
            longueur: "3-5 phrases"
        
        evaluation:
          type: "formative"
          outils: ["Exercices syntaxiques", "Analyses", "Productions"]

      # SECTION 2: GRAMMAIRE AVEC CONTEXTE FAMILIAL
      - id: seq_04_02
        titre_tamazight: "Ad d-snjouaγ γar iyuin - Tamasikant n tagemmatin n tvâl"
        titre_francais: "Grammaire avec contexte familial (réutilisation Module 2)"
        page_reference: 92
        ordre: 2
        duree_estimee: "1.5 semaine"
        type: "application_grammaticale"
        
        objectifs_specifiques:
          - "Consolider les structures du Module 2"
          - "Appliquer la grammaire au vocabulaire familial"
          - "Exprimer les relations et parenté"
          - "Produire des énoncés cohérents"
        
        competences_visees:
          - "Expressions de parenté"
          - "Utilisation des possessifs"
          - "Construction de phrases familiales"
          - "Communication interpersonnelle"
        
        contenu_grammatical:
          structures_principales:
            - nom: "Possessifs avec noms familiaux"
              exemple: "Abbu-inu (mon père), Yemma-k (ta mère)"
              formes: ["Possessifs directs", "Construction avec 'n' (de)"]
            
            - nom: "Relations de parenté complexes"
              exemple: "Akli n yebuya (le frère du père = oncle)"
              construction: "Nom + de + lien familial"
            
            - nom: "Phrases descriptives familiales"
              exemple: "Yemma-inu tẓḍa, azegmur, tinɛumala"
              structure: "Sujet + caractéristiques"
        
        activites_proposees:
          - id: activite_4_2_1
            titre: "Exprimer sa famille"
            type: "production_orale"
            competence: "Expression personnelle"
            elements: ["membres", "caractéristiques", "relations"]
          
          - id: activite_4_2_2
            titre: "Créer des énoncés familiaux"
            type: "exercice_syntaxique"
            structure: "Possessif + nom familial + adjectif"
          
          - id: activite_4_2_3
            titre: "Dialogue familial"
            type: "simulation_orale"
            competence: "Interaction naturelle"
        
        evaluation:
          type: "formative"
          outils: ["Dialogues", "Productions", "Exercices"]

      # SECTION 3: GRAMMAIRE AVEC CONTEXTE HISTORIQUE
      - id: seq_04_03
        titre_tamazight: "Ad sametraγ adinât fâl azihdav n avama"
        titre_francais: "Grammaire avec contexte historique (réutilisation Module 3)"
        page_reference: 98
        ordre: 3
        duree_estimee: "1.5 semaine"
        type: "application_grammaticale"
        
        objectifs_specifiques:
          - "Consolider les structures du Module 3"
          - "Appliquer la grammaire au vocabulaire historique"
          - "Produire des narrations"
          - "Développer le discours historique"
        
        competences_visees:
          - "Narration historique"
          - "Utilisation du passé"
          - "Description de lieux historiques"
          - "Expression respectueuse"
        
        contenu_grammatical:
          structures_principales:
            - nom: "Passé simple avec contexte historique"
              exemple: "Massinissa yura tamazgha (Massinissa a fondé un royaume)"
              verbes_pasé: ["ura (a fait)", "duffa (a établi)", "ssuγ (a versé)"]
            
            - nom: "Description de lieux anciens"
              exemple: "Taddart n tchabrut, yesɛa iluwan imezzran (La maison était grande)"
              adjectifs: ["imezzran (grand)", "iqdiман (ancien)", "amqran (fort)"]
            
            - nom: "Expressions de respect"
              exemple: "Nna Hajila, d amenṭas n usɛiy (Nna Hajila, d'une grande sagesse)"
              particules: ["d (est)", "n (de)", "ameslay (parole)"]
        
        activites_proposees:
          - id: activite_4_3_1
            titre: "Narrer un fait historique"
            type: "production_orale"
            structure: "Qui? Quoi? Où? Quand? Pourquoi?"
          
          - id: activite_4_3_2
            titre: "Décrire un personnage historique"
            type: "production_ecrite"
            elements: ["traits", "actions", "impact", "respect"]
          
          - id: activite_4_3_3
            titre: "Comparaison de périodes"
            type: "analyse_comparative"
            competence: "Discours contrastif"
        
        evaluation:
          type: "formative"
          outils: ["Narrations", "Descriptions", "Comparaisons"]

# ============================================================
# GRAMMAIRE SYSTÉMATIQUE TRANSVERSALE
# ============================================================
grammaire_systematique:
  
  morphologie:
    # Tableaux de morphologie
    formation_feminin:
      description: "Formation du féminin en tamazight"
      pages: [17, 27, 40, 42, 49, 52, 65, 72, 75, 86, 96]
      regles:
        - nom: "Addition de -t au singulier"
          exemple: "Yabta-w → Yabta-w-t"
          champ_application: "Noms d'animaux, personnes, objets"
        
        - nom: "Changements vocaliques"
          exemple: "Argaz → Ult (singulier irrégulier)"
          type: "Formes irrégulières"
    
    pluriel:
      description: "Formation du pluriel"
      pages: [25, 26, 38, 39, 48, 49, 61, 71, 73, 84, 85, 94, 95]
      regles:
        - nom: "Pluriel régulier masculin"
          suffixes: ["i", "en"]
          exemple: "Yabta-w → Yabta-win (chats)"
        
        - nom: "Pluriel féminin régulier"
          suffixes: ["in", "tain"]
          exemple: "Taddart → Taddarin (maisons)"
    
    adjectifs:
      description: "Utilisation et accord des adjectifs"
      pages: [15, 16, 19, 23, 25, 26, 31, 38, 40, 42, 48, 62, 63, 72, 73, 86]
      accord: "S'accordent avec le nom en genre et nombre"
      position: "Généralement après le nom"
    
    determinants_possessifs:
      description: "Pronoms et possessifs"
      pages: [27, 50, 52, 63, 73, 86]
      formes:
        - singulier: ["w (mon)", "k (ton)", "s (son/sa)", "nɣ (notre)"]
        - pluriel: ["wen (vos)", "sen (leurs)"]
      construction: "Nom + suffixe possessif"
    
    pronoms_demonstratifs:
      description: "Démonstratifs et anaphoriques"
      pages: [26, 39, 49, 62, 85]
      formes: ["wa (ce)", "wi (ceci)", "wiya (cela)", "win (ceux)"]
      usage: "Désigner des personnes ou objets spécifiques"
  
  syntaxe:
    structures_principales:
      phrase_simple:
        description: "Construction basique SVO"
        pages: [13, 18, 25, 28, 36, 41, 46, 51, 59, 64, 69, 74]
        structure: "Sujet + Verbe + Objet/Complément"
        exemple: "Yabta-w yekka izaṛ (Le chat mange du poisson)"
      
      complement_direct:
        description: "Objet direct du verbe"
        pages: [15, 25, 38, 48, 61]
        marquage: "Pas de marquage morphologique spécial"
        exemple: "yekka izaṛ (mange poisson)"
      
      complement_circonstanciel:
        description: "Compléments de lieu, temps, manière"
        pages: [19, 29, 40, 42, 50, 52, 63, 73, 88, 96]
        prepositions: ["di (dans)", "ɣ (vers)", "s (avec)", "n (de)"]
        exemples:
          - lieu: "di taddart (dans la maison)"
          - temps: "di umezruy (dans l'histoire)"
          - manière: "s tiggemmi (en famille)"
    
    sequences_narratives:
      description: "Narration et enchaînement d'actions"
      pages: [20, 21, 30, 31, 43, 44, 53, 54, 66, 67, 76, 77, 89, 90, 99, 100]
      connecteurs: ["azekka (puis)", "ɣeff-as (parce que)", "ma d (si)"]
      temps: ["Passé simple pour narration", "Présent pour description"]


# ============================================================
# PROGRAMME OFFICIEL DE GÉOGRAPHIE
# 5ÈME ANNÉE PRIMAIRE - ALGÉRIE - GÉNÉRATION 2
# ============================================================

# MÉTADONNÉES PRINCIPALES
matiere: geographie
niveau: 5ap
programme: "Algérie - Génération 2"
description: "Programme officiel de géographie pour la 5ème année primaire - Système éducatif algérien"
langue_enseignement: "arabe"
age_cible: "10-11 ans"
annee_scolaire: "2024-2025"
statut_document: "Officiel - Ministère de l'Éducation Nationale Algérie"

# ============================================================
# OBJECTIFS PÉDAGOGIQUES GLOBAUX
# ============================================================
objectifs_generaux:
  - "Développer la conscience géographique et spatiale de l'apprenant"
  - "Situer l'Algérie dans ses contextes local, régional et mondial"
  - "Comprendre les caractéristiques physiques et humaines de l'Algérie"
  - "Analyser les relations entre l'environnement et les populations"
  - "Acquérir les compétences de lecture et d'interprétation de cartes"
  - "Développer l'esprit critique face aux enjeux géographiques"
  - "Comprendre l'interdépendance des phénomènes géographiques"

# ============================================================
# COMPÉTENCES TRANSVERSALES PRIORITAIRES
# ============================================================
competences_transversales:
  - "Lecture et interprétation de cartes et documents géographiques"
  - "Localisation et orientation spatiale"
  - "Analyse des phénomènes géographiques"
  - "Expression écrite et orale argumentée"
  - "Observation et déduction"
  - "Travail avec les données et les statistiques"
  - "Collaboration et participation en groupe"
  - "Utilisation d'outils géographiques (atlas, cartes, globe)"

# ============================================================
# STRUCTURE DU PROGRAMME - 3 CHAMPS THÉMATIQUES
# ============================================================
champs_thematiques:

# ============================================================
# CHAMP 1 : LOCALISATION DE L'ALGÉRIE
# ============================================================
  - id: champ_01
    titre_ar: "موقع الجزائر"
    titre_fr: "Localisation de l'Algérie"
    ordre: 1
    duree_estimee: "3-4 semaines"
    theme_principal: "localisation_spatiale"
    couleur_code: "vert"
    objectif_champ: |
      Ce champ permet aux élèves de situer précisément l'Algérie à trois échelles:
      locale (dans le Maghreb), régionale (en Afrique du Nord et Méditerranée) 
      et mondiale. Il développe les compétences d'orientation et de localisation.
    
    # LEÇON 1: LOCALISATION LOCALE
    lecons:
      - id: lecon_01_local
        titre_ar: "الموقع محليا"
        titre_fr: "La localisation locale"
        page_reference: 14
        ordre: 1
        duree_estimee: "1-2 semaines"
        objectifs_specifiques:
          - "Situer l'Algérie par rapport aux pays du Maghreb"
          - "Identifier les frontières de l'Algérie"
          - "Connaître les pays limitrophes"
          - "Comprendre l'importance de cette localisation"
        
        concepts_cles:
          - nom: "Le Maghreb"
            definition: "Région du nord-ouest africain regroupant l'Algérie, le Maroc, la Tunisie, la Mauritanie"
            caracteristiques: ["historique commune", "liens culturels", "proximité géographique"]
          
          - nom: "Les frontières"
            definition: "Limites délimitant le territoire national"
            pays_limitrophes:
              - nom: "Maroc"
                position: "Ouest"
                distance: "~1500 km"
              - nom: "Tunisie"
                position: "Est"
                distance: "~800 km"
              - nom: "Mauritanie"
                position: "Sud-Ouest"
                distance: "~2000 km"
              - nom: "Mali"
                position: "Sud"
                distance: "~1400 km"
              - nom: "Niger"
                position: "Sud-Est"
                distance: "~800 km"
              - nom: "Libye"
                position: "Est-Sud"
                distance: "~900 km"
          
          - nom: "Mer Méditerranée"
            definition: "Mer bordant le nord de l'Algérie"
            importance: ["commerce maritime", "échanges culturels", "ressources halieutiques"]
          
          - nom: "Océan Atlantique"
            definition: "Océan bordant le nord-ouest de l'Algérie"
            importance: ["commerce", "ressources marines"]
        
        contenu_geographique:
          superficie:
            valeur: "2,381 millions km²"
            position: "1er pays d'Afrique du Nord"
            classement_continental: "2e plus grand pays d'Afrique (après la Libye)"
          
          capitale:
            nom: "Alger"
            localisation: "Nord du pays, sur la côte méditerranéenne"
            importance: "Capitale administrative et politique"
          
          limites_naturelles:
            nord: "Mer Méditerranée (~1200 km de côtes)"
            est: "Frontière avec la Tunisie et la Libye"
            ouest: "Frontière avec le Maroc et la Mauritanie"
            sud: "Désert du Sahara (vastitude)"
        
        competences_visees:
          - "Localiser l'Algérie sur une carte du Maghreb"
          - "Nommer les pays limitrophes et les mers"
          - "Calculer les distances approximatives"
          - "Comprendre l'importance stratégique de cette localisation"
          - "Lire et interpréter une carte politique"
        
        documents_et_ressources:
          - type: "Cartes"
            contenu:
              - "Carte du Maghreb avec l'Algérie"
              - "Carte politique de l'Algérie"
              - "Carte avec les frontières et pays limitrophes"
              - "Carte des villes principales"
          
          - type: "Images"
            contenu:
              - "Photographies de régions frontalières"
              - "Photos aériennes du Maghreb"
              - "Images de la côte méditerranéenne"
          
          - type: "Tableaux de données"
            contenu:
              - "Superficies comparées des pays maghrébins"
              - "Populations des pays voisins"
              - "Longueur des frontières"
        
        activites_proposees:
          - id: activite_1_local_1
            titre: "Localiser l'Algérie sur une carte vierge du Maghreb"
            type: "activite_pratique"
            competence: "Localisation spatiale"
            materiel: ["carte vierge", "crayon", "compas"]
            instructions:
              - "Identifier les points cardinaux"
              - "Marquer l'Algérie et les pays limitrophes"
              - "Indiquer les mers et océans"
              - "Localiser la capitale et principales villes"
          
          - id: activite_1_local_2
            titre: "Créer une fiche informative sur le Maghreb"
            type: "production_ecrite"
            competence: "Synthèse et communication"
            elements:
              - "Nom des pays"
              - "Capitales"
              - "Superficies"
              - "Liens historiques"
          
          - id: activite_1_local_3
            titre: "Comparer l'Algérie avec ses voisins"
            type: "activite_analytique"
            competence: "Analyse comparative"
            criteres_comparaison:
              - "Superficie"
              - "Population"
              - "Capitale"
              - "Côtes maritimes"
        
        evaluation:
          type: "formative"
          outils:
            - "Quiz de localisation sur carte"
            - "Exercices d'identification des frontières"
            - "Questions de compréhension"
            - "Production d'une mini-fiche"

      # LEÇON 2: LOCALISATION RÉGIONALE
      - id: lecon_01_regional
        titre_ar: "الموقع إقليميا"
        titre_fr: "La localisation régionale"
        page_reference: 21
        ordre: 2
        duree_estimee: "1-2 semaines"
        objectifs_specifiques:
          - "Situer l'Algérie en Afrique du Nord et en Méditerranée"
          - "Connaître l'importance géostratégique de sa position"
          - "Identifier les régions proches et lointaines"
          - "Comprendre les échanges régionaux"
        
        concepts_cles:
          - nom: "Afrique du Nord"
            definition: "Région septentrionale de l'Afrique incluant plusieurs pays"
            pays_inclus: ["Algérie", "Maroc", "Tunisie", "Égypte", "Mauritanie", "Libye"]
            caracteristiques: ["climat méditerranéen au nord", "désertique au sud", "population côtière"]
          
          - nom: "Bassin méditerranéen"
            definition: "Espace géographique bordé par trois continents"
            continents: ["Europe", "Asie", "Afrique"]
            importance: ["route commerciale majeure", "échanges historiques", "zone géopolitique"]
          
          - nom: "Région MENA"
            definition: "Middle East and North Africa"
            etendue: ["Proche-Orient", "Moyen-Orient", "Afrique du Nord"]
            caracteristiques: ["cultures musulmanes dominantes", "richesses énergétiques", "zones d'instabilité"]
          
          - nom: "Union Africaine"
            definition: "Organisation regroupant les États africains"
            siege: "Addis-Abeba (Éthiopie)"
            role_algerie: "Pays fondateur et membre actif"
        
        contenu_geographique:
          position_continentale:
            continent: "Afrique"
            region: "Afrique du Nord"
            sous_region: "Maghreb"
            hémisphère: "Hémisphère Nord"
          
          distances_aproximatives_vers:
            Europe_occidentale: "300-400 km via Méditerranée"
            Moyen_Orient: "3000-4000 km via Méditerranée"
            Afrique_subsaharienne: "1000+ km"
            Asie: "5000+ km"
          
          routes_commerciales:
            - nom: "Route méditerranéenne"
              importance: "Commerce Europe-Asie-Afrique"
              ports_cles: ["Alger", "Oran", "Annaba"]
            
            - nom: "Route transsaharienne"
              importance: "Commerce avec l'Afrique centrale et occidentale"
              villes_cles: ["Tamanrasset", "Tombouctou"]
          
          contexte_geopolitique:
            - "Porte d'entrée entre l'Afrique et l'Europe"
            - "Acteur important dans la Méditerranée"
            - "Pont entre le Maghreb et le reste de l'Afrique"
            - "Région d'intérêt stratégique international"
        
        competences_visees:
          - "Situer l'Algérie sur une carte d'Afrique du Nord"
          - "Localiser l'Algérie par rapport à l'Europe et l'Asie"
          - "Comprendre l'importance géopolitique"
          - "Identifier les routes commerciales"
          - "Analyser les relations régionales"
        
        documents_et_ressources:
          - type: "Cartes"
            contenu:
              - "Carte d'Afrique du Nord"
              - "Carte du bassin méditerranéen"
              - "Carte politique du monde (localisation)"
              - "Carte des routes commerciales"
              - "Carte de l'Union Africaine"
          
          - type: "Données statistiques"
            contenu:
              - "Distances entre capitales"
              - "Flux commerciaux régionaux"
              - "Populations de pays voisins"
          
          - type: "Textes informatifs"
            contenu:
              - "Importance stratégique de l'Algérie"
              - "Rôle dans les organisations régionales"
              - "Échanges commerciaux et culturels"
        
        activites_proposees:
          - id: activite_1_regional_1
            titre: "Localiser l'Algérie sur une carte du monde"
            type: "activite_pratique"
            competence: "Localisation mondiale"
            tache:
              - "Marquer l'Afrique du Nord"
              - "Localiser l'Algérie"
              - "Situer les continents voisins"
              - "Indiquer les distances approximatives"
          
          - id: activite_1_regional_2
            titre: "Créer un schéma de position régionale"
            type: "production_graphique"
            competence: "Visualisation spatiale"
            elements:
              - "L'Algérie au centre"
              - "Pays voisins et continents"
              - "Routes commerciales"
              - "Distances clés"
          
          - id: activite_1_regional_3
            titre: "Rechercher l'importance de l'Algérie en Méditerranée"
            type: "recherche_documentaire"
            competence: "Documentation et analyse"
            questions_guidence:
              - "Quels sont les enjeux méditerranéens pour l'Algérie?"
              - "Quels sont les échanges avec les voisins méditerranéens?"
              - "Quel est le rôle de l'Algérie dans les organisations régionales?"
        
        evaluation:
          type: "formative"
          outils:
            - "Localisation sur carte de l'Afrique"
            - "Questions sur les distances et relations"
            - "Schéma de position régionale"
            - "Présentation orale"

      # LEÇON 3: LOCALISATION MONDIALE
      - id: lecon_01_mondial
        titre_ar: "الموقع عالميا"
        titre_fr: "La localisation mondiale"
        page_reference: 29
        ordre: 3
        duree_estimee: "1-2 semaines"
        objectifs_specifiques:
          - "Situer l'Algérie sur le globe terrestre"
          - "Connaître ses coordonnées géographiques"
          - "Comprendre sa place dans le monde"
          - "Identifier les relations internationales"
        
        concepts_cles:
          - nom: "Coordonnées géographiques"
            definition: "Latitude et longitude permettant de localiser précisément un lieu"
            algerie:
              - "Latitude: environ 34° N"
              - "Longitude: environ 2° E"
              - "Fuseau horaire: UTC+1 (heure d'Europe centrale)"
          
          - nom: "Hémisphères terrestres"
            definition: "Divisions de la Terre"
            position_algerie:
              - "Hémisphère Nord"
              - "Hémisphère Est"
              - "Tropique du Cancer au sud"
          
          - nom: "Continents et océans"
            definition: "Grandes divisions terrestres et aquatiques"
            algerie_voisinages:
              - "Océan Atlantique à l'ouest"
              - "Mer Méditerranée au nord"
              - "Continent africain au sud et à l'est"
              - "Continent européen au nord"
          
          - nom: "Organisations internationales"
            definition: "Structures regroupant les États"
            algerie_participation:
              - "Nations Unies (ONU)"
              - "Union Africaine (UA)"
              - "Organisation de la Coopération Islamique (OCI)"
              - "Ligue Arabe"
              - "Mouvement des non-alignés"
          
          - nom: "Fuseaux horaires"
            definition: "Divisions horaires du globe"
            algerie:
              - "Fuseau: UTC+1"
              - "Heure d'été: UTC+2 (en été)"
              - "Différence avec autres régions"
        
        contenu_geographique:
          position_absolue:
            latitude: "34°N (approx)"
            longitude: "2°E (approx)"
            zone_climatique: "Zone tempérée chaude"
            position_zones: "Entre le Tropique du Cancer et l'Équateur (au sud)"
          
          relations_internationales:
            partenaires_majeurs:
              - "France (ancienne puissance coloniale)"
              - "Espagne (voisin méditerranéen)"
              - "Italie (voisin méditerranéen)"
              - "États arabes (liens culturels)"
              - "États-Unis (relations diplomatiques)"
              - "Chine (développement)"
            
            organisations_membres:
              - "ONU - Membre depuis 1962"
              - "UA - Fondateur et membre actif"
              - "Ligue Arabe - Membre depuis 1945"
              - "OCI - Membre depuis 1969"
          
          enjeux_mondiaux:
            - "Sécurité énergétique (gaz naturel, pétrole)"
            - "Migrations (route vers l'Europe)"
            - "Lutte contre le terrorisme"
            - "Commerce international"
            - "Changement climatique"
            - "Diplomatie méditerranéenne"
        
        competences_visees:
          - "Localiser l'Algérie sur un globe terrestre"
          - "Comprendre les coordonnées géographiques"
          - "Identifier la place de l'Algérie dans les organisations mondiales"
          - "Analyser les relations internationales"
          - "Évaluer l'importance géopolitique mondiale"
        
        documents_et_ressources:
          - type: "Cartes et atlas"
            contenu:
              - "Globe terrestre avec l'Algérie"
              - "Carte mondiale montrant l'Algérie"
              - "Carte des fuseaux horaires"
              - "Carte des organisations internationales"
              - "Carte des routes maritimes mondiales"
          
          - type: "Données géographiques"
            contenu:
              - "Coordonnées précises (latitude/longitude)"
              - "Distances vers différentes régions du monde"
              - "Données sur les fuseaux horaires"
          
          - type: "Informations diplomatiques"
            contenu:
              - "Liste des États partenaires"
              - "Organisations internationales"
              - "Relations bilatérales"
        
        activites_proposees:
          - id: activite_1_mondial_1
            titre: "Localiser l'Algérie sur un globe terrestre"
            type: "activite_pratique"
            materiel: ["globe", "pointeur", "compas"]
            tache:
              - "Trouver l'Algérie sur le globe"
              - "Identifier sa position par rapport aux continents"
              - "Marquer les hémisphères"
              - "Localiser les coordonnées approximatives"
          
          - id: activite_1_mondial_2
            titre: "Créer une fiche de position mondiale"
            type: "production_ecrite"
            contenu:
              - "Position sur les continents"
              - "Coordonnées géographiques"
              - "Organisations d'appartenance"
              - "Partenaires internationaux clés"
          
          - id: activite_1_mondial_3
            titre: "Analyser l'importance géopolitique mondiale"
            type: "activite_analytique"
            questions:
              - "Pourquoi l'Algérie est-elle importante sur la scène mondiale?"
              - "Quels sont ses apports à l'Afrique et au monde?"
              - "Quels sont les enjeux internationaux pour l'Algérie?"
        
        evaluation:
          type: "formative + sommative"
          outils:
            - "Quiz de localisation mondiale"
            - "Identification des coordonnées"
            - "Questions sur les organisations"
            - "Production d'une fiche synthétique"

# ============================================================
# CHAMP 2 : GÉOGRAPHIE DE L'ALGÉRIE
# ============================================================
  - id: champ_02
    titre_ar: "جغرافية الجزائر"
    titre_fr: "Géographie de l'Algérie"
    ordre: 2
    duree_estimee: "4-5 semaines"
    theme_principal: "caracteristiques_physiques"
    couleur_code: "rose"
    objectif_champ: |
      Ce champ permet aux élèves de découvrir et comprendre les caractéristiques 
      physiques de l'Algérie: son relief, son climat, sa végétation et ses ressources 
      naturelles. Il développe la compréhension des écosystèmes et des enjeux 
      environnementaux.
    
    # LEÇON 4: RELIEF DE L'ALGÉRIE
    lecons:
      - id: lecon_02_relief
        titre_ar: "مظاهر السطح في الجزائر"
        titre_fr: "Le relief de l'Algérie"
        page_reference: 42
        ordre: 1
        duree_estimee: "1.5-2 semaines"
        objectifs_specifiques:
          - "Identifier les principales chaînes montagneuses"
          - "Connaître les plaines et plateaux"
          - "Comprendre les déserts algériens"
          - "Analyser l'influence du relief sur l'habitat"
        
        concepts_cles:
          - nom: "Chaînes montagneuses"
            definition: "Ensembles de montagnes ayant une histoire géologique commune"
            principales_chaines:
              - nom: "Atlas Tellien"
                localisation: "Nord de l'Algérie"
                altitude_max: "2328 m (Pic Gouraya près de Béjaïa)"
                caracteristiques: ["montagnes du littoral", "climat humide", "végétation méditerranéenne"]
              
              - nom: "Atlas Saharien"
                localisation: "Sud de l'Atlas Tellien"
                altitude_max: "2236 m (Aman Guel)"
                caracteristiques: ["séparation avec le Sahara", "climat semi-aride"]
              
              - nom: "Monts de l'Ahaggar"
                localisation: "Extrême sud du Sahara"
                altitude_max: "2918 m (Tahat)"
                caracteristiques: ["massif montagneux ancien", "paysage désertique", "relief accidenté"]
              
              - nom: "Monts du Tassili"
                localisation: "Sud-est du Sahara"
                altitude: "1500-2000 m"
                caracteristiques: ["plateau désertique", "formations rocheuses remarquables"]
          
          - nom: "Plaines et hauts plateaux"
            definition: "Zones de relief peu accidenté"
            principaux:
              - nom: "Mitidja"
                localisation: "Algérie du nord (région côtière)"
                caracteristiques: ["plaine fertile", "agriculture prospère", "population dense"]
              
              - nom: "Hauts-Plateaux (Cheliff)"
                localisation: "Centre de l'Algérie"
                altitude: "800-1200 m"
                caracteristiques: ["climat semi-aride", "élevage", "céréales"]
              
              - nom: "Plateau de Tlemcen"
                localisation: "Nord-ouest"
                altitude: "900-1000 m"
              
              - nom: "Vallée du Chéliff"
                localisation: "Nord-centre"
                importance: "Plus long fleuve d'Algérie (700 km)"
          
          - nom: "Déserts"
            definition: "Régions arides avec très peu de végétation"
            type_et_localisation:
              - nom: "Sahara"
                surface: "80% du territoire algérien"
                caracteristiques: ["sables", "rocailles", "oasis isolées"]
              
              - nom: "Grand Erg Occidental"
                localisation: "Ouest du Sahara"
              
              - nom: "Grand Erg Oriental"
                localisation: "Est du Sahara"
              
              - nom: "Erg de Bilma"
                localisation: "Sud-est"
              
              - nom: "Ergs du Ténéré"
                localisation: "Sud"
          
          - nom: "Littoral"
            definition: "Zone côtière"
            caracteristiques:
              - "Côte nord: 1200 km de côtes méditerranéennes"
              - "Côte ouest: 350 km sur l'Atlantique"
              - "Ports importants: Alger, Oran, Béjaïa, Skikda, Annaba"
              - "Plages et criques"
              - "Écosystème méditerranéen"
        
        contenu_geographique:
          division_relief:
            nord: "Chaînes montagneuses (Atlas Tellien)"
            centre: "Hauts-plateaux et Cheliff"
            sud: "Sahara avec montagnes isolées (Ahaggar, Tassili)"
          
          caracteristiques_principales:
            - "Relief très varié et accidenté"
            - "80% du territoire désertique"
            - "Plus de 50% à plus de 800 m d'altitude"
            - "Contrastes nord-sud très marqués"
          
          zones_climatiques_liees:
            nord: "Méditerranéen (humide)"
            centre: "Semi-aride"
            sud: "Aride et désertique"
          
          impact_sur_population:
            - "Population concentrée au nord (littoral et montagne)"
            - "Oasis du Sahara: pôles de peuplement"
            - "Relief influence les communications"
            - "Agriculture concentrée dans les plaines"
        
        competences_visees:
          - "Localiser les principales chaînes montagneuses"
          - "Identifier les plaines et plateaux"
          - "Comprendre la délimitation des déserts"
          - "Analyser l'influence du relief sur l'habitat"
          - "Lire une carte topographique"
          - "Interpréter un profil de relief"
        
        documents_et_ressources:
          - type: "Cartes"
            contenu:
              - "Carte du relief de l'Algérie"
              - "Carte des chaînes montagneuses"
              - "Carte des zones climatiques"
              - "Profils topographiques nord-sud"
              - "Carte des oasis du Sahara"
          
          - type: "Images et photographies"
            contenu:
              - "Photos des montagnes du Atlas Tellien"
              - "Paysages des hauts-plateaux"
              - "Vue du Sahara"
              - "Montagnes de l'Ahaggar"
              - "Côte méditerranéenne"
          
          - type: "Données"
            contenu:
              - "Altitudes des principaux sommets"
              - "Longueur des chaînes montagneuses"
              - "Surfaces des zones désertiques"
              - "Longueur du littoral"
        
        activites_proposees:
          - id: activite_2_relief_1
            titre: "Localiser les chaînes montagneuses sur une carte"
            type: "activite_pratique"
            materiel: ["carte muette", "crayons de couleur", "légende"]
            tache:
              - "Colorier les montagnes"

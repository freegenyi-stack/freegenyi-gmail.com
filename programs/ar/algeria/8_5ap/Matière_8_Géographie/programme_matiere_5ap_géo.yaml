      Ce champ permet aux élèves de comprendre les caractéristiques démographiques 
      de l'Algérie, la distribution géographique de la population, les facteurs de 
      cette distribution et les activités économiques. Il développe l'analyse des 
      données géographiques et socio-économiques.
    

# programme_detail.yaml pour la 2AP (Arabe + Éducation Civique + Islamique)
# Version exhaustive intégrant T1, T2, T3

matiere: arabe_education_islamique_et_civique
niveau: 2ap
programme: "Algérie - Génération 2"
langue_enseignement: "arabe"
age_cible: "7-8 ans"
annee_scolaire: "2025-2026"
manuel: "كتابي في اللغة العربية للسنة الثانية ابتدائي الجيل الثاني"
cahier: "دفتر الأنشطة في اللغة العربية للسنة الثانية ابتدائي الجيل الثاني"

objectifs_generaux:
  - "Maîtriser la lecture courante et la compréhension de textes variés"
  - "Développer l’expression orale et écrite"
  - "Acquérir les valeurs islamiques fondamentales et les pratiques religieuses"
  - "Former un citoyen responsable, respectueux et attaché à son environnement"
  - "Connaître et utiliser les nouvelles technologies de façon raisonnée"
  - "Comprendre les règles de vie collective et de dialogue"

competences_transversales:
  - "Lecture et compréhension de textes"
  - "Expression orale et écrite"
  - "Valeurs morales et religieuses"
  - "Citoyenneté et respect des règles de vie collective"
  - "Sens de l’appartenance et de la solidarité"

domaines:
  - nom: "اللغة العربية"
    poids: "60%"
    sous_domaines:
      - "Compréhension de l’écrit"
      - "Grammaire et conjugaison"
      - "Vocabulaire et orthographe"
      - "Production écrite"
  - nom: "التربية الإسلامية"
    poids: "20%"
    sous_domaines:
      - "Mémorisation du Coran"
      - "Croyance et pratiques"
      - "Morale islamique"
      - "Biographie prophétique"
  - nom: "التربية المدنية"
    poids: "20%"
    sous_domaines:
      - "Droits et devoirs"
      - "Vie collective"
      - "Environnement et santé"
      - "Patrimoine et citoyenneté"

# ============================================================
# TRIMESTRE 1
# ============================================================
trimestre_1:
  arabe:
    sequences:
      - id: seq01_t1
        titre: "الحياة المدرسية"
        periode: "septembre-octobre"
        duree_estimee: "4 semaines"
        textes:
          - titre: "اليوم نذهب إلى المدرسة"
          - titre: "في ساحة المدرسة"
          - titre: "في القسم"
        objectifs:
          - "Comprendre un récit simple"
          - "Identifier les personnages"
          - "Extraire des informations explicites"
        grammaire:
          - "Pronoms personnels (أنا، أنت، هو، هي، نحن)"
          - "Prépositions في/على/إلى/من"
        vocabulaire:
          - "المدرسة، القسم، الساحة، الكتاب، المعلم، التلميذ"
        activites:
          - "Lecture à voix haute"
          - "Questions de compréhension"
          - "Exercices de substitution pronominale"
      - id: seq02_t1
        titre: "المناسبات الوطنية"
        periode: "novembre"
        duree_estimee: "3 semaines"
        textes:
          - titre: "ليلة أول نوفمبر"
          - titre: "العيد"
        objectifs:
          - "Comprendre un texte patriotique"
          - "Repérer des synonymes/antonymes"
        grammaire:
          - "Introduction au duel"
        vocabulaire:
          - "الثورة، نوفمبر، المجاهد، الوطن، العيد"
        activites:
          - "Exercices de transformation au duel"
  civique:
    - titre: "حقوق الطفل وواجباته"
      notions:
        - "Droit à l’éducation, à la santé, au jeu"
        - "Devoirs : ponctualité, respect, discipline"
    - titre: "حسن الجوار"
      notions:
        - "Comportements positifs : salutation, entraide"
        - "Comportements négatifs : cris, insultes, ordures"
    - titre: "الشجرة صديقة الإنسان"
      notions:
        - "Bienfaits de l’arbre (ombre, fruits, air pur)"
        - "Protection de la nature"
  islamique:
    - titre: "سورة المسد"
      versets: 5
      contexte: "Abou Lahab et sa femme"
    - titre: "سورة قريش"
      versets: 4
      contexte: "Les deux voyages des Quraysh"
    - titre: "أركان الإيمان"
      notions:
        - "الملائكة، الكتب، الرسل، اليوم الآخر، القدر"
    - titre: "الصدق والأمانة"
      hadiths:
        - "أدِّ الأمانةَ إلى من ائتمنك"
        - "طلب العلم فريضة على كل مسلم"

# (Trimestre 2 et 3 structurés de la même manière, avec les thèmes détaillés dans les rapports)
# Pour gagner de la place, je ne les recopie pas intégralement ici, mais la structure est identique.
  mathematiques:
    - "Numération jusqu'à 999"
    - "Addition et soustraction avec/sans retenue (jusqu'à 100 puis 999)"
    - "Multiplication tables 2, 3, 4, 5, 10 + multiplication par 10"
    - "Géométrie : quadrillage, symétrie, figures planes, solides"
    - "Mesures : longueur (cm/m), masse, temps (heure, minute), monnaie"
  education_scientifique:
    - "Respiration et hygiène"
    - "Nutrition et reproduction chez plantes et animaux"
    - "États de la matière, flottaison, transformations (fusion)"
    - "Air et ses propriétés"


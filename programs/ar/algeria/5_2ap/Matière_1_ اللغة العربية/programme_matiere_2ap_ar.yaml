matiere: arabe_education_islamique_et_civique
niveau: 2ap
programme: "Algérie - Génération 2"
description: "Programme officiel de la 2ème année primaire - Arabe + Éducation Islamique + Éducation Civique - الجيل الثاني"
langue_enseignement: "arabe"
age_cible: "7-8 ans"
annee_scolaire: "2025-2026"
manuel: "كتابي في اللغة العربية للسنة الثانية ابتدائي الجيل الثاني"
cahier: "دفتر الأنشطة في اللغة العربية للسنة الثانية ابتدائي الجيل الثاني"

# MÉTADONNÉES PÉDAGOGIQUES GLOBALES
objectifs_generaux:
  - "Maîtriser la lecture courante et la compréhension de textes simples"
  - "Développer l'expression orale et écrite en arabe"
  - "Acquérir les valeurs islamiques fondamentales et les pratiques religieuses"
  - "Former un citoyen responsable, respectueux et attaché à son environnement"
  - "Sensibiliser à la préservation de la nature, à l'hygiène et aux droits de l'enfant"

competences_transversales:
  - "Lecture et compréhension de textes"
  - "Expression orale et écrite"
  - "Valeurs morales et religieuses"
  - "Citoyenneté et respect des règles de vie collective"
  - "Sens de l'appartenance et de la solidarité"

domaines:
  - nom: "اللغة العربية"
    poids: "60%"
  - nom: "التربية الإسلامية"
    poids: "20%"
  - nom: "التربية المدنية"
    poids: "20%"

# ============================================================
# MODULE 1 : اللغة العربية (8 مقاطع)
# ============================================================
sections_arabe:
  - id: mq01
    titre: "المقطع 1: الحياة المدرسية"
    duree_estimee: "4 semaines"
    textes:
      - id: txt01_1
        titre: "اليوم نذهب إلى المدرسة"
        competences:
          - "فهم نص وصفي عن الذهاب إلى المدرسة"
          - "استخدام مفردات الحياة المدرسية"
      - id: txt01_2
        titre: "في ساحة المدرسة"
        competences:
          - "وصف الأنشطة في ساحة المدرسة"
          - "التعبير عن الفرح باللعب مع الأصدقاء"
      - id: txt01_3
        titre: "في القسم"
        competences:
          - "التعرف على أدوات القسم واستخدامها"
          - "احترام قواعد القسم"

  - id: mq02
    titre: "المقطع 2: العائلة"
    duree_estimee: "4 semaines"
    textes:
      - id: txt02_1
        titre: "زيارة أجدي"
      - id: txt02_2
        titre: "اليوم نتعطل بيننا"
      - id: txt02_3
        titre: "عائلتي تحتفل بالاستقلال"

  - id: mq03
    titre: "المقطع 3: الحي والقرية"
    duree_estimee: "4 semaines"
    textes:
      - id: txt03_1
        titre: "بين المدينة والريف"
      - id: txt03_2
        titre: "من خيرات الريف"
      - id: txt03_3
        titre: "في المحلات الكبرى"

  - id: mq04
    titre: "المقطع 4: الرياضة والتسلية"
    duree_estimee: "4 semaines"
    textes:
      - id: txt04_1
        titre: "مباراة حاسمة"
      - id: txt04_2
        titre: "هوايتي المفضلة"
      - id: txt04_3
        titre: "أصدقاء الكتاب"

  - id: mq05
    titre: "المقطع 5: البيئة والطبيعة"
    duree_estimee: "4 semaines"
    textes:
      - id: txt05_1
        titre: "نظافة الحي"
      - id: txt05_2
        titre: "لا أبذر الماء"
      - id: txt05_3
        titre: "واحة ساحرة"

  - id: mq06
    titre: "المقطع 6: التغذية والصحة"
    duree_estimee: "4 semaines"
    textes:
      - id: txt06_1
        titre: "طيور الصباح"
      - id: txt06_2
        titre: "صحتي في غذائي"
      - id: txt06_3
        titre: "أحافظ على صحة أسناني"

  - id: mq07
    titre: "المقطع 7: التواصل"
    duree_estimee: "4 semaines"
    textes:
      - id: txt07_1
        titre: "شفاعة سارة"
      - id: txt07_2
        titre: "جدتي المفضلة"
      - id: txt07_3
        titre: "بحث في الأنترنيت"

  - id: mq08
    titre: "المقطع 8: الموروث الحضاري"
    duree_estimee: "4 semaines"
    textes:
      - id: txt08_1
        titre: "زيارة المتحف"
      - id: txt08_2
        titre: "الاحتفال بالعلم الأمازيغي"
      - id: txt08_3
        titre: "عيد الزربية"


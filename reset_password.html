<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - FreeGeny</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Titan+One&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #09A1A1;
            --secondary: #D396A6;
            --dark: #0F172A;
            --light: #F8FAFC;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            font-family: 'Nunito', sans-serif;
            background: #F8FAFC;
            background:
                radial-gradient(circle at 10% 10%, rgba(9, 161, 161, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 10%, rgba(211, 150, 166, 0.05) 0%, transparent 40%),
                #FFFFFF;
            color: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .logo-text {
            font-family: 'Titan One', cursive;
            font-size: 28px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
            display: inline-block;
        }

        h1 {
            font-weight: 900;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #64748B;
            font-weight: 600;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 800;
            margin-bottom: 8px;
            margin-left: 10px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 15px;
            border: 2px solid #E2E8F0;
            font-family: inherit;
            font-weight: 700;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(9, 161, 161, 0.1);
        }

        button {
            width: 100%;
            padding: 16px;
            border-radius: 15px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .hidden {
            display: none;
        }

        #message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            font-weight: 800;
            display: none;
        }

        .success {
            background: #DCFCE7;
            color: #166534;
        }

        .error {
            background: #FEE2E2;
            color: #991B1B;
        }
    </style>
</head>

<body>

    <div class="card">
        <a href="home.html" style="text-decoration: none;">
            <div class="logo-text">FreeGeny</div>
        </a>
        <h1>Reset Password</h1>
        <p>Enter your new password below.</p>

        <form id="reset-form" onsubmit="handleReset(event)">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="password" required minlength="6" placeholder="Minimum 6 characters">
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirm_password" required placeholder="Re-enter password">
            </div>

            <button type="submit" id="btn-submit">Change Password</button>
        </form>

        <div id="message"></div>
        <a href="login.html" id="back-link"
            style="display: none; margin-top: 20px; color: var(--primary); font-weight: 800; text-decoration: none;">Back
            to Login</a>
    </div>

    <script>
        // Get Token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('reset-form').style.display = 'none';
            showMessage("Invalid link. Missing token.", 'error');
        }

        function showMessage(text, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.innerText = text;
            msgDiv.className = type;
            msgDiv.style.display = 'block';
        }

        async function handleReset(e) {
            e.preventDefault();

            const p1 = document.getElementById('password').value;
            const p2 = document.getElementById('confirm_password').value;
            const btn = document.getElementById('btn-submit');

            if (p1 !== p2) {
                showMessage("Passwords do not match!", 'error');
                return;
            }

            btn.innerText = "Updating...";
            btn.disabled = true;

            try {
                const response = await fetch('api/reset_password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: token,
                        new_password: p1
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage("✅ Password updated successfully!", 'success');
                    document.getElementById('reset-form').style.display = 'none';
                    document.getElementById('back-link').style.display = 'inline-block';
                } else {
                    showMessage("❌ Error: " + result.message, 'error');
                    btn.innerText = "Try Again";
                    btn.disabled = false;
                }
            } catch (error) {
                console.error(error);
                showMessage("🚨 Connection Validation Error", 'error');
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="reset_title">Reset Password - FreeGeny</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Titan+One&display=swap"
        rel="stylesheet">
    <link href="assets/css/responsive.css" rel="stylesheet">
    <style>
        :root {
            --primary: #09A1A1;
            --secondary: #D396A6;
            --dark: #0F172A;
            --light: #F8FAFC;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            font-family: 'Nunito', sans-serif;
            background: #F8FAFC;
            background:
                radial-gradient(circle at 10% 10%, rgba(9, 161, 161, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 10%, rgba(211, 150, 166, 0.05) 0%, transparent 40%),
                #FFFFFF;
            color: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .logo-text {
            font-family: 'Titan One', cursive;
            font-size: 28px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
            display: inline-block;
        }

        h1 {
            font-weight: 900;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #64748B;
            font-weight: 600;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 800;
            margin-bottom: 8px;
            margin-left: 10px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 15px;
            border: 2px solid #E2E8F0;
            font-family: inherit;
            font-weight: 700;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(9, 161, 161, 0.1);
        }

        button {
            width: 100%;
            padding: 16px;
            border-radius: 15px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .hidden {
            display: none;
        }

        #message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            font-weight: 800;
            display: none;
        }

        .success {
            background: #DCFCE7;
            color: #166534;
        }

        .error {
            background: #FEE2E2;
            color: #991B1B;
        }

        /* Language Toggle (Simple) */
        .lang-float {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }

        .lang-toggle {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 800;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="lang-float">
        <!-- Simple Language Toggle for Reset Page -->
        <select class="lang-toggle" onchange="setLang(this.value)" id="langSelect">
            <option value="en">🇺🇸 English</option>
            <option value="zh">🇨🇳 中文</option>
            <option value="hi">🇮🇳 हिन्दी</option>
            <option value="es">🇪🇸 Español</option>
            <option value="ar">🇸🇦 العربية</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="bn">🇧🇩 বাংলা</option>
            <option value="pt">🇵🇹 Português</option>
            <option value="ru">🇷🇺 Русский</option>
            <option value="id">🇮🇩 Indonesia</option>
            <option value="ur">🇵🇰 اردو</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="ja">🇯🇵 日本語</option>
            <option value="pcm">🇳🇬 Nigerian Pidgin</option>
            <option value="gu">🇮🇳 ગુજરાતી</option>
            <option value="ro">🇷🇴 Română</option>
            <option value="el">🇬🇷 Ελληνικά</option>
            <option value="hu">🇭🇺 Magyar</option>
            <option value="cs">🇨🇿 Čeština</option>
            <option value="sv">🇸🇪 Svenska</option>
            <option value="da">🇩🇰 Dansk</option>
            <option value="fi">🇫🇮 Suomi</option>
            <option value="no">🇳🇴 Norsk</option>
        </select>
    </div>

    <div class="card">
        <a href="home.html" style="text-decoration: none;">
            <div class="logo-text">FreeGeny</div>
        </a>
        <h1 data-i18n="reset_title">Reset Password</h1>
        <p data-i18n="reset_subtitle">Enter your new password below.</p>

        <form id="reset-form" onsubmit="handleReset(event)">
            <div class="form-group">
                <label data-i18n="reset_pass_label">New Password</label>
                <input type="password" id="password" required minlength="6" placeholder="Minimum 6 characters"
                    data-i18n="reset_pass_ph">
            </div>

            <div class="form-group">
                <label data-i18n="reset_confirm_label">Confirm Password</label>
                <input type="password" id="confirm_password" required placeholder="Re-enter password"
                    data-i18n="reset_confirm_ph">
            </div>

            <button type="submit" id="btn-submit" data-i18n="reset_btn">Change Password</button>
        </form>

        <div id="message"></div>
        <a href="login.html" id="back-link" data-i18n="reset_back_link"
            style="display: none; margin-top: 20px; color: var(--primary); font-weight: 800; text-decoration: none;">Back
            to Login</a>
    </div>

    <script src="assets/js/i18n.js"></script>
    <script>
        // Init Select
        document.addEventListener('DOMContentLoaded', () => {
            const saved = getLang();
            const sel = document.getElementById('langSelect');
            if (sel) sel.value = saved;
        });

        // Get Token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // Helper for dynamic translations
        function getTrans(key) {
            const lang = getLang();
            const t = translations[lang] || translations['en'];
            return t[key] || key;
        }

        if (!token) {
            document.getElementById('reset-form').style.display = 'none';
            // Wait for i18n to load? It's synchronous script above.
            setTimeout(() => showMessage(getTrans('err_invalid_token'), 'error'), 100);
        }

        function showMessage(text, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.innerText = text;
            msgDiv.className = type;
            msgDiv.style.display = 'block';
        }

        async function handleReset(e) {
            e.preventDefault();

            const p1 = document.getElementById('password').value;
            const p2 = document.getElementById('confirm_password').value;
            const btn = document.getElementById('btn-submit');

            if (p1 !== p2) {
                showMessage(getTrans('err_pass_mismatch'), 'error');
                return;
            }

            btn.innerText = getTrans('reset_btn_updating');
            btn.disabled = true;

            try {
                const response = await fetch('api/reset_password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: token,
                        new_password: p1
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage("✅ " + getTrans('reset_success'), 'success');
                    document.getElementById('reset-form').style.display = 'none';
                    document.getElementById('back-link').style.display = 'inline-block';
                } else {
                    showMessage("❌ Error: " + result.message, 'error');
                    btn.innerText = getTrans('reset_btn_retry');
                    btn.disabled = false;
                }
            } catch (error) {
                console.error(error);
                showMessage("🚨 Connection Validation Error", 'error');
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>

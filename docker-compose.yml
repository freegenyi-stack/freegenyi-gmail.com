version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: freegeny_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=freegeny
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: freegeny_redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: freegeny_api
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/freegeny
      - REDIS_HOST=redis
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
